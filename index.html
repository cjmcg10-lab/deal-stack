<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deal Stack</title>
<meta name="description" content="Your coupons, card offers and the best way to pay, in one place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deal Stack">
<meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F15" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; coupon "tickets" with a torn stub; sticky top bar and a bottom tab bar. */
:root {
  --paper: #EEF0F3;
  --card: #FFFFFF;
  --ink: #121722;
  --ink-2: #4B5468;
  --ink-3: #7A8396;
  --line: #D8DCE4;
  --marker: #FFD43B;
  --marker-ink: #1A1500;
  --tint: #E4E8EF;
  --offer: #DCE6FF;
  --offer-ink: #1E3F99;
  --portal: #D9F2E6;
  --portal-ink: #155C3E;
  --good: #1E7F52;
  --good-bg: #DDF3E7;
  --info: #2756C8;
  --info-bg: #E1E9FC;
  --warn: #9A5B0C;
  --warn-bg: #FBEBD3;
  --mute: #5F6778;
  --mute-bg: #E6E8ED;
  --bad: #B33A27;
  --bad-bg: #F8E1DC;
  --shadow: 0 1px 0 rgba(18, 23, 34, .06), 0 8px 24px -14px rgba(18, 23, 34, .25);
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C0F15; --card: #161B25; --ink: #EDF0F5; --ink-2: #B0B8C8; --ink-3: #848DA0; --line: #2A3141;
    --marker: #FFD43B; --marker-ink: #1A1500; --tint: #212838; --offer: #1C2B52; --offer-ink: #AFC4FF;
    --portal: #163527; --portal-ink: #9BE0BE; --good: #5CD39A; --good-bg: #133324; --info: #8FB0FF; --info-bg: #1A2747;
    --warn: #F2B35E; --warn-bg: #3A2A12; --mute: #A3AABA; --mute-bg: #232A38; --bad: #FF8E7A; --bad-bg: #3D1C17;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 10px 26px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C0F15; --card: #161B25; --ink: #EDF0F5; --ink-2: #B0B8C8; --ink-3: #848DA0; --line: #2A3141;
  --marker: #FFD43B; --marker-ink: #1A1500; --tint: #212838; --offer: #1C2B52; --offer-ink: #AFC4FF;
  --portal: #163527; --portal-ink: #9BE0BE; --good: #5CD39A; --good-bg: #133324; --info: #8FB0FF; --info-bg: #1A2747;
  --warn: #F2B35E; --warn-bg: #3A2A12; --mute: #A3AABA; --mute-bg: #232A38; --bad: #FF8E7A; --bad-bg: #3D1C17;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 10px 26px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
a { color: var(--info); }

.app { max-width: 600px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  margin: 0 -16px; padding: 10px 16px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.logo { display: flex; align-items: center; gap: 8px; font: 700 22px/1 var(--f-display); letter-spacing: .01em; }
.logo svg { width: 26px; height: 26px; flex: none; }
.topbar .spacer { flex: 1; }
.iconbtn {
  width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
}
.iconbtn svg { width: 19px; height: 19px; }
.iconbtn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.banner {
  margin: 12px 0 0; padding: 10px 12px; border-radius: 12px;
  background: var(--warn-bg); color: var(--warn); font-size: 13.5px; line-height: 1.4;
}
.banner b { color: inherit; }

/* Headings */
.view-head { padding: 18px 0 6px; }
.view-head h1 { margin: 0; font: 700 34px/1.02 var(--f-display); letter-spacing: .005em; text-wrap: balance; }
.view-head .sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
section { margin-top: 22px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
.sec-head h2 { margin: 0; font: 700 21px/1.1 var(--f-display); letter-spacing: .01em; }
.sec-head .hint { color: var(--ink-3); font-size: 12.5px; }
.sec-head .more { margin-left: auto; font-size: 13px; color: var(--info); background: none; border: 0; padding: 0; }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }

/* Summary strip */
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.tally div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 9px; min-width: 0; }
.tally b { display: block; font: 700 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tally span { display: block; margin-top: 3px; color: var(--ink-2); font-size: 12px; line-height: 1.25; }

/* Chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 12px -16px 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink-2); font-size: 13.5px; font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .n { margin-left: 5px; opacity: .65; font-variant-numeric: tabular-nums; }

/* Coupon ticket */
.list { display: flex; flex-direction: column; gap: 10px; }
.coupon {
  position: relative; display: grid; grid-template-columns: 86px 1fr; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 0;
  box-shadow: var(--shadow); overflow: hidden;
}
.coupon::before, .coupon::after {
  content: ''; position: absolute; left: 77px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--paper); border: 1px solid var(--line);
}
.coupon::before { top: -10px; }
.coupon::after { bottom: -10px; }
.stub {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  padding: 12px 6px; border-right: 2px dashed var(--line); min-height: 100%;
  background: var(--marker); color: var(--marker-ink);
}
.stub[data-kind="sale"] { background: var(--tint); color: var(--ink); }
.stub[data-kind="cardoffer"] { background: var(--offer); color: var(--offer-ink); }
.stub[data-kind="portal"] { background: var(--portal); color: var(--portal-ink); }
.stub .pre { font: 600 9.5px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.stub .big { font: 700 31px/.95 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stub .big.sm { font-size: 22px; }
.stub .unit { font: 700 12px/1 var(--f-display); letter-spacing: .14em; }
.cbody { padding: 11px 13px 11px 15px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand { font-weight: 700; font-size: 14.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctitle { color: var(--ink); font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gist { color: var(--ink-2); font-size: 12.5px; line-height: 1.35; }
.row3 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
.codetag {
  font: 600 12px/1 var(--f-mono); letter-spacing: .04em; padding: 4px 7px; border-radius: 6px;
  border: 1.5px dashed var(--ink-3); color: var(--ink);
}
.cattag { font-size: 11.5px; color: var(--ink-3); }
.why { font-size: 11.5px; color: var(--good); font-weight: 600; }

/* Status pill */
.status { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status .sc { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 500; }
.s-tested { background: var(--good-bg); color: var(--good); }
.s-official { background: var(--info-bg); color: var(--info); }
.s-likely { background: var(--warn-bg); color: var(--warn); }
.s-unconfirmed { background: var(--mute-bg); color: var(--mute); }
.s-failed, .s-expired { background: var(--bad-bg); color: var(--bad); }

/* Stacks list */
.stackrow {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px;
}
.stackrow + .stackrow { margin-top: 8px; }
.stackrow .nm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stackrow .pc { grid-row: span 2; font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: right; }
.stackrow .pc small { display: block; font: 500 11px/1.2 var(--f-body); color: var(--ink-3); letter-spacing: 0; }
.stackrow .how { color: var(--ink-2); font-size: 12.5px; min-width: 0; }
.mark { background: linear-gradient(transparent 55%, var(--marker) 55%); padding: 0 2px; color: inherit; }
:root[data-theme="dark"] .mark { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--marker) 45%, transparent) 55%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mark { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--marker) 45%, transparent) 55%); } }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.input, select.input {
  width: 100%; min-width: 0; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font-size: 16px;
}
.search { position: relative; margin-top: 12px; }
.search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--ink-3); }
.search .input { padding-left: 38px; }
.filters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.filters select { padding: 9px 8px; font-size: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 16px; border-radius: 12px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 600; font-size: 15px; text-decoration: none;
}
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
.btn.sm { padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.count { color: var(--ink-3); font-size: 12.5px; margin: 12px 0 8px; }
.empty { padding: 26px 16px; text-align: center; color: var(--ink-2); background: var(--card); border: 1px dashed var(--line); border-radius: var(--r); }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; }

/* Best way */
.picker { position: relative; }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 15; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-height: 280px; overflow-y: auto; }
.suggest button { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 11px 14px; border: 0; background: none; text-align: left; border-bottom: 1px solid var(--line); }
.suggest button:last-child { border-bottom: 0; }
.suggest small { color: var(--ink-3); }
.waygrid { display: grid; grid-template-columns: 1fr 120px; gap: 8px; margin-top: 12px; }
.amount { position: relative; }
.amount span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.amount .input { padding-left: 24px; font-variant-numeric: tabular-nums; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.plan { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
.plan-top { padding: 16px 16px 14px; border-bottom: 2px dashed var(--line); }
.plan-top .eyebrow { margin-bottom: 6px; }
.plan-save { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.plan-save .big { font: 700 46px/.95 var(--f-display); font-variant-numeric: tabular-nums; }
.plan-save .of { color: var(--ink-2); font-size: 14px; }
.plan-pay { margin-top: 6px; color: var(--ink-2); font-size: 13px; }
.plan-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 700 14px/1 var(--f-display); }
.parts { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.parts div { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.parts div span:first-child { color: var(--ink-2); min-width: 0; }
.parts div span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
.parts .tot { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 700; }
.parts .tot span:first-child { color: var(--ink); }
.notes { display: flex; flex-direction: column; gap: 6px; }
.note { font-size: 12.5px; color: var(--ink-2); padding-left: 12px; border-left: 3px solid var(--line); }
.note.warnnote { border-color: var(--marker); color: var(--ink); }
.alts { display: flex; flex-direction: column; gap: 4px; }
.alts div { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.alts div:last-child { border-bottom: 0; }
.alts span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-2); }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.rules { display: flex; flex-direction: column; gap: 8px; }
.rule { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.rule b { display: block; margin-bottom: 3px; }
.rule p { margin: 0; color: var(--ink-2); font-size: 13.5px; }

/* My list */
.addrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
.planitem { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.planitem + .planitem { margin-top: 10px; }
.planitem .ph { display: flex; align-items: center; gap: 10px; }
.planitem .ph b { flex: 1; min-width: 0; }
.planitem .ph small { color: var(--ink-3); }
.planitem .pm { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.x { border: 0; background: none; color: var(--ink-3); padding: 4px 6px; font-size: 13px; }

/* Cards tab */
.wallet { display: flex; flex-direction: column; gap: 10px; }
.wcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px; }
.wcard .wh { display: flex; align-items: center; gap: 10px; }
.wcard .wh b { flex: 1; min-width: 0; }
.wcard ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
.wcard ul li + li { margin-top: 2px; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; inset: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span::after { transform: translateX(18px); }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.progrow { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.progrow:last-child { border-bottom: 0; }
.progrow div { flex: 1; min-width: 0; }
.progrow small { display: block; color: var(--ink-3); font-size: 12px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 14px; }
.panel.pad { padding: 14px; }
.brandpick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-height: 210px; overflow-y: auto; }
.ocr-row { display: grid; grid-template-columns: 22px 1fr 70px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ocr-row .input { padding: 8px 10px; font-size: 15px; }

/* Sheet */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 15, .45); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 600px; margin: 0 auto;
  max-height: calc(92% - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); border-radius: 22px 22px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 40px -10px rgba(0,0,0,.35);
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 10px; }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; }
.sheet-head h3 { margin: 0; flex: 1; font: 700 26px/1.05 var(--f-display); text-wrap: balance; }
.detail-val { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.detail-val .stub { border-radius: 12px; border-right: 0; padding: 12px 14px; min-width: 92px; min-height: 0; }
.detail-val .gist { font-size: 14px; }
.codebox { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px; border-radius: 14px; border: 2px dashed var(--ink-3); background: var(--card); }
.codebox code { flex: 1; min-width: 0; font: 600 22px/1.1 var(--f-mono); letter-spacing: .06em; overflow-wrap: anywhere; }
.block { margin-top: 16px; }
.block h4 { margin: 0 0 8px; font: 700 18px/1.1 var(--f-display); letter-spacing: .01em; }
.bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.bullets li { position: relative; padding-left: 20px; font-size: 14.5px; }
.bullets li::before { content: ''; position: absolute; left: 3px; top: .55em; width: 7px; height: 7px; border-radius: 2px; background: var(--ink); transform: rotate(45deg); }
.reasons { display: flex; flex-direction: column; gap: 6px; }
.reasons div { display: flex; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.reasons div::before { content: ''; flex: none; width: 8px; height: 8px; margin-top: .45em; border-radius: 50%; background: var(--mute); }
.reasons div.good::before { background: var(--good); }
.reasons div.bad::before { background: var(--bad); }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 6px 0 10px; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.fullterms { margin-top: 8px; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.toggle-terms { margin-top: 10px; background: none; border: 0; padding: 0; color: var(--info); font-weight: 600; font-size: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.src-list { display: flex; flex-direction: column; font-size: 13px; }
.src-list div { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.src-list i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--bad); }
.src-list i.ok { background: var(--good); }
.src-list span small { display: block; color: var(--ink-3); }
.mono { font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(6, 1fr);

  background: color-mix(in srgb, var(--card) 92%, transparent);

  border-top: 1px solid var(--line);
}
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border: 0; background: none; color: var(--ink-3); font-size: 10.5px; font-weight: 600; border-radius: 10px; white-space: nowrap; min-width: 0; letter-spacing: -.005em; }
.tabbar svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"] svg { color: var(--ink); }
.tabbar button[aria-current="page"] .tb-dot { background: var(--marker); }
.tb-ico { position: relative; }
.tb-dot { position: absolute; right: -5px; top: -2px; width: 8px; height: 8px; border-radius: 50%; background: transparent; }

.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; box-shadow: var(--shadow);
}
.connect { padding-top: 40px; display: flex; flex-direction: column; gap: 14px; }
.connect h1 { margin: 0; font: 700 40px/1 var(--f-display); }
.connect p { margin: 0; color: var(--ink-2); }
.err { color: var(--bad); font-size: 13.5px; }
.loading { padding: 60px 0; text-align: center; color: var(--ink-2); }

/* What a deal applies to */
.applies { display: block; font-size: 12.5px; line-height: 1.35; color: var(--ink); }
.applies b { font-weight: 700; color: var(--ink-3); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; margin-right: 4px; }
.applies-box { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--marker); display: flex; flex-direction: column; gap: 5px; }
.applies-box .ab-text { font-size: 16px; font-weight: 600; line-height: 1.35; }
.banner.info { background: var(--info-bg); color: var(--info); }

/* Chips that wrap / sit flush */
.chips.flush { margin-top: 0; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
.store-chip { color: var(--ink); font-weight: 600; }

/* Coupon code tickets (Codes tab and store pages) */
.cgroup + .cgroup { margin-top: 18px; }
.cgroup-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
.linkish { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; padding: 2px 0; color: var(--ink); font: 700 19px/1.1 var(--f-display); letter-spacing: .01em; text-align: left; }
.linkish svg { color: var(--ink-3); flex: none; }
.sheet .linkish { margin-top: 2px; font: 600 14px/1.2 var(--f-body); color: var(--info); }
.sheet .linkish svg { color: var(--info); width: 16px; height: 16px; }
.cticket {
  position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  overflow: hidden;
}
.cticket + .cticket { margin-top: 10px; }
.cticket::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--marker); }
.cticket-main { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 12px 14px 10px 18px; border: 0; background: none; text-align: left; }
.cticket-top { display: flex; align-items: flex-start; gap: 8px; }
.cvalue { font: 700 20px/1.1 var(--f-display); letter-spacing: .005em; min-width: 0; }
.ccode {
  align-self: flex-start; font: 600 17px/1 var(--f-mono); letter-spacing: .07em; padding: 8px 11px; border-radius: 9px;
  border: 2px dashed var(--ink-3); background: var(--paper); overflow-wrap: anywhere;
}
.cticket-actions { display: flex; gap: 8px; padding: 10px 14px 12px 18px; border-top: 1.5px dashed var(--line); }
.cticket-actions .btn { flex: 1; }
.cticket-actions .btn svg { flex: none; }

/* Star */
.star { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-3); border-radius: 10px; padding: 0; }
.star svg { fill: none; }
.star.on { color: #E0A800; }
.star.on svg { fill: var(--marker); stroke: #C99400; }

/* Store list */
.panel.flat { padding: 0 6px 0 2px; }
.storerow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px; padding: 6px 4px 6px 0; border-bottom: 1px solid var(--line); }
.storerow:last-child { border-bottom: 0; }
.storerow-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; border: 0; background: none; text-align: left; padding: 6px 4px; }
.storerow .nm { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.storerow .how { color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
.storerow .pc { font: 700 22px/1 var(--f-display); text-align: right; font-variant-numeric: tabular-nums; padding-right: 6px; }
.storerow .pc small { display: block; font: 500 10.5px/1.2 var(--f-body); color: var(--ink-3); }
.storerow .pc.muted { color: var(--ink-3); }
.filters.two { grid-template-columns: 1fr 1fr; }
.filters.one { grid-template-columns: 1fr; }
.center { text-align: center; margin: 14px 0 0; }

/* Store page */
.backbar { display: flex; align-items: center; gap: 10px; padding-top: 14px; }
.store-head { padding-top: 10px; }
.sh-row { display: flex; align-items: center; gap: 6px; }
.sh-row h1 { flex: 1; min-width: 0; }
.sh-row .star { width: 42px; height: 42px; }
.sh-row .star svg { width: 26px; height: 26px; }

/* Product rows */
.prow {
  display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left;

}
.pinfo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pbrand { font-size: 11.5px; color: var(--ink-3); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname { font-size: 14px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pmeta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.pmeta:empty { display: none; }
.pprice { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; text-align: right; font-variant-numeric: tabular-nums; }
.pprice b { font: 700 20px/1 var(--f-display); }
.pprice s, .pbig s, .mini-price s { color: var(--ink-3); font-size: 12px; }
.ppct { font-size: 11.5px; font-weight: 700; color: var(--good); }
.thumb {
  width: 56px; height: 56px; border-radius: 10px; overflow: hidden; flex: none; display: grid; place-items: center;
  background: #fff; border: 1px solid var(--line);
}
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb.ph { background: var(--tint); color: var(--ink-3); font: 700 22px/1 var(--f-display); }
.thumb.sm { width: 40px; height: 40px; border-radius: 8px; font-size: 17px; }
.thumb.lg { width: 104px; height: 104px; border-radius: 14px; font-size: 36px; }

/* Price verdicts */
.vbadge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.v-low { background: var(--good-bg); color: var(--good); }
.v-always, .v-higher { background: var(--bad-bg); color: var(--bad); }
.v-steady { background: var(--info-bg); color: var(--info); }
.v-new { background: var(--mute-bg); color: var(--mute); }
p.verdict { margin: 0 0 8px; font-size: 14.5px; line-height: 1.45; background: none; padding: 0; color: var(--ink); }
p.verdict .vbadge { margin-right: 4px; vertical-align: 1px; }
.pdetail { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin-top: 12px; }
.pbig { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.pbig b { font: 700 34px/1 var(--f-display); }

/* Items a deal covers */
.mini-list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.mini { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px 8px 8px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.mini:last-child { border-bottom: 0; }
.mini-name { font-size: 13.5px; line-height: 1.3; min-width: 0; }
.mini-name em { color: var(--ink-3); font-style: normal; }
.mini-price { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.mini-price b { font-size: 14px; }

/* Settings toggles */
.toggles { display: flex; flex-direction: column; margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tog:last-child { border-bottom: 0; }

@media (max-width: 370px) {
  .tabbar button { font-size: 9.5px; }
  .cvalue { font-size: 18px; }
  .prow { grid-template-columns: 48px 1fr auto; gap: 10px; }
  .prow .thumb { width: 48px; height: 48px; }
}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 640px) { .app { padding-left: 24px; padding-right: 24px; } }

</style>

  function boot() {
    readHash();
    if (PREVIEW) return startDemo();
    render();
    fetch('/api/ping', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (p) {
      if (!p || p.app !== 'deal-stack') return startDemo();
      S.live = true;
      S.ping = p;
      registerWorker();
      if (!S.key) { S.mode = 'connect'; render(); return; }
      var cached = store.get('cache', null);
      if (cached && cached.deals) { S.raw = cached; S.mode = 'ready'; derive(); render(); }
      load();
    }).catch(startDemo);
  }

  function load(manual) {
    S.busy = true; paintTopbar();
    api('/api/deals').then(function (j) {
      S.busy = false;
      if (j._status === 401) { S.mode = 'connect'; S.connectErr = "That key doesn't match the APP_KEY in Cloudflare."; render(); return; }
      if (!j.ok) { paintTopbar(); toast(j.error || 'Could not load deals.'); if (!S.raw) { S.raw = { deals: [], tests: [], sight: {}, status: {}, pstats: {} }; S.mode = 'ready'; derive(); render(); } return; }
      S.raw = j;
      if (j.settings) { S.settings = mergeSettings(j.settings); store.set('settings', S.settings); }
      else if (S.live) api('/api/settings', { method: 'PUT', body: { settings: S.settings } });
      S.mode = 'ready';
      derive(); render();
      if (manual) toast('Updated: ' + S.items.filter(usable).length + ' deals you can use');
      try { var txt = JSON.stringify(j); if (txt.length < 2500000) store.set('cache', j); else store.del('cache'); } catch (e) { }
    }).catch(function () {
      S.busy = false; paintTopbar();
      toast(S.raw ? 'No connection. Showing your saved deals.' : 'Could not reach your hub.');
      if (!S.raw) { S.mode = 'connect'; S.connectErr = 'Could not reach your hub. Check your connection and try again.'; render(); }
    });
  }

  function startDemo() {
    S.demo = true; S.live = false; S.mode = 'ready';
    S.raw = sampleData(new Date());
    var saved = store.get('settings', null);
    S.settings = mergeSettings(saved || S.raw.settings);
    derive(); render();
  }

  function readHash() {
    var h = String(location.hash || '').replace(/^#/, '');
    if (!h) return;
    var m = /(?:^|&)store=([^&]+)/.exec(h);
    if (m) { S.tab = 'stores'; S.stores.view = decodeURIComponent(m[1]); }
    m = /(?:^|&)tab=([^&]+)/.exec(h);
    if (m && TABS.some(function (t) { return t.id === m[1]; })) S.tab = m[1];
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
  }
  window.addEventListener('hashchange', function () { readHash(); if (S.mode === 'ready') render(); });

  /* ---------------- deriving what to show ---------------- */
  function usable(x) { return x.a.status !== 'failed' && x.a.status !== 'expired'; }
  function working(x) { return x.a.status === 'tested' || x.a.status === 'official' || x.a.status === 'likely'; }
  function shown(x) { return usable(x) && !isHidden(x.rec.d.domain); }

  function derive() {
    var now = new Date();
    var raw = S.raw || { deals: [] };
    var testsBy = {};
    (raw.tests || []).forEach(function (t) { (testsBy[t.deal_id] = testsBy[t.deal_id] || []).push(t); });
    S.items = []; S.byId = {}; S.byDomain = {};
    (raw.deals || []).forEach(function (rec) {
      if (!rec || !rec.d) return;
      var a = E.assess(rec, { now: now, sight: raw.sight || {}, tests: testsBy[rec.id] || [], pstats: raw.pstats || {} });
      var x = { rec: rec, a: a };
      S.items.push(x); S.byId[rec.id] = x;
      (S.byDomain[rec.d.domain] = S.byDomain[rec.d.domain] || []).push(x);
    });
    computeStacks();
  }

  function realDomain(d) { return d && d.indexOf('deal:') !== 0 && d !== 'unknown'; }

  function storeOf(dom) { return E.storeFor(dom, (S.byDomain[dom] || []).map(function (x) { return x.rec; })); }

  function computeStacks() {
    S.stacks = {}; S.extras = {}; S.summaries = {};
    Object.keys(S.byDomain).forEach(function (dom) {
      var items = S.byDomain[dom];
      S.summaries[dom] = E.storeSummary(dom, items);
      if (!realDomain(dom)) return;
      var plan = E.planForStore(storeOf(dom), items, S.settings, 100);
      S.stacks[dom] = plan;
      var discPct = plan.discount ? plan.discount.value : 0;
      S.extras[dom] = plan.best ? Math.max(0, plan.best.total - discPct) : 0;
    });
    S.recs = E.recommend(S.items, S.settings, S.extras);
  }

  /* ---------------- shared pieces ---------------- */
  function stubFor(x) {
    var p = x.a.terms, d = x.rec.d;
    var pre = p.upTo ? 'up to' : (p.extra ? 'extra' : '');
    var big = '', unit = '', sm = false;
    if (d.kind === 'product' && d.product) {
      if (d.product.pct) { big = d.product.pct + '%'; unit = 'OFF'; } else { big = E.money(d.product.price); unit = 'PRICE'; }
      pre = d.product.pct ? '' : 'posted';
    } else if ((d.kind === 'cardoffer' || d.kind === 'portal') && (p.cashPct || p.cashAmt)) {
      big = p.cashPct ? E.pctStr(p.cashPct) : E.money(p.cashAmt); unit = 'BACK';
    } else if (p.tiers && p.tiers.length >= 2) { big = E.money(p.tiers[p.tiers.length - 1].amt); unit = 'OFF'; pre = 'up to'; }
    else if (p.stackText) { big = p.pct + '%'; unit = 'OFF'; pre = 'total'; }
    else if (p.pctHigh) { big = p.pct + '–' + p.pctHigh + '%'; unit = 'OFF'; sm = true; }
    else if (p.pct) { big = E.pctStr(p.pct); unit = 'OFF'; }
    else if (p.amt) { big = E.money(p.amt); unit = 'OFF'; }
    else if (p.cashPct) { big = E.pctStr(p.cashPct); unit = 'BACK'; }
    else if (p.cashAmt) { big = E.money(p.cashAmt); unit = 'BACK'; }
    else if (p.bogo) { big = 'BOGO'; sm = true; }
    else if (p.freeShip) { big = 'FREE'; unit = 'SHIP'; sm = true; }
    else if (d.code) { big = 'CODE'; sm = true; }
    else { big = 'DEAL'; sm = true; }
    if (String(big).length >= 5) sm = true;
    return '<div class="stub" data-kind="' + esc(d.kind) + '">' + (pre ? '<span class="pre">' + esc(pre) + '</span>' : '') +
      '<span class="big' + (sm ? ' sm' : '') + '">' + esc(big) + '</span>' + (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div>';
  }

  function statusPill(a, withScore) {
    var s = E.STATUS[a.status] || { label: a.status };
    return '<span class="status s-' + esc(a.status) + '"><i></i>' + esc(s.label) + (withScore !== false ? ' <span class="sc">' + a.score + '</span>' : '') + '</span>';
  }

  function verdictBadge(v) {
    if (!v) return '';
    var label = { low: 'Lowest seen', always: 'Always this price?', higher: 'Was lower', steady: 'Steady price', new: 'Tracking price' }[v.code] || '';
    return label ? '<span class="vbadge v-' + esc(v.code) + '">' + esc(label) + '</span>' : '';
  }

  function kindWord(d) {
    if (d.kind === 'cardoffer') return (E.PROGRAMS[d.card] || {}).name || 'Card offer';
    if (d.kind === 'portal') return 'Capital One Shopping';
    return null;
  }

  function thumb(img, name, cls) {
    var initial = esc(String(name || '?').replace(/[^A-Za-z0-9]/g, '').charAt(0).toUpperCase() || '?');
    if (!img) return '<span class="thumb ph ' + (cls || '') + '" aria-hidden="true">' + initial + '</span>';
    return '<span class="thumb ' + (cls || '') + '"><img src="' + esc(img) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'ph\');this.parentNode.textContent=\'' + initial + '\'"></span>';
  }

  // One line saying exactly what the deal covers.
  function appliesLine(x) {
    var d = x.rec.d;
    if (d.kind === 'product') return '';
    return '<div class="applies"><b>Applies to</b> ' + esc(x.a.applies) + '</div>';
  }

  function couponCard(x, why) {
    var d = x.rec.d, a = x.a;
    if (d.kind === 'product') return productRow(x, why);
    var kw = kindWord(d);
    var title = d.kind === 'cardoffer' || d.kind === 'portal' ? (kw + ': ' + (a.terms.headline || d.title)) : d.title;
    var cond = conditions(x);
    return '<button class="coupon" data-action="deal" data-id="' + esc(x.rec.id) + '">' + stubFor(x) +
      '<div class="cbody"><div class="row1"><span class="brand">' + esc(d.brand) + '</span>' + statusPill(a) + '</div>' +
      '<div class="ctitle">' + esc(title) + '</div>' + appliesLine(x) +
      (cond ? '<div class="gist">' + esc(cond) + '</div>' : '') +
      '<div class="row3">' + (d.code ? '<span class="codetag">' + esc(d.code) + '</span>' : '') +
      (why && why.length ? '<span class="why">' + esc(why[0]) + '</span>' : '') +
      '</div></div></button>';
  }

  // The conditions in a few words ("$75 min · new customers · ends Oct 31").
  function conditions(x) {
    var p = x.a.terms;
    var parts = [];
    if (p.tiers && p.tiers.length >= 2) parts.push(p.tiers.map(function (t) { return E.money(t.amt) + ' off ' + E.money(t.min); }).join(', '));
    else if (p.minSpend) parts.push(E.money(p.minSpend) + ' min');
    if (p.cap) parts.push('max ' + E.money(p.cap));
    if (p.newCust) parts.push('new customers');
    if (p.members) parts.push('members');
    if (p.storeCard) parts.push("store's card");
    if (p.verify) parts.push('ID check');
    if (p.signup) parts.push('email sign-up');
    if (p.appOnly) parts.push('app only');
    if (p.inStore) parts.push('in-store only'); else if (p.online) parts.push('online only');
    if (p.exclSale) parts.push('not on sale items');
    if (p.noStack) parts.push("can't combine");
    if (x.a.expires) parts.push((x.rec.d.expSet ? 'ends ' : 'about ') + E.fmtDay(x.a.expires));
    return parts.join(' · ');
  }

  function productRow(x, why) {
    var d = x.rec.d, pr = d.product || {};
    return '<button class="prow" data-action="deal" data-id="' + esc(x.rec.id) + '">' + thumb(pr.img, pr.name) +
      '<span class="pinfo"><span class="pbrand">' + esc(d.brand) + (d.section ? ' · ' + esc(d.section) : '') + '</span>' +
      '<span class="pname">' + esc(pr.name || d.title) + '</span>' +
      '<span class="pmeta">' + verdictBadge(x.a.verdict) + (pr.stock === 'out' ? '<span class="vbadge v-higher">Out of stock</span>' : pr.stock === 'low' ? '<span class="vbadge v-new">Low stock</span>' : '') +
      (why && why.length ? '<span class="why">' + esc(why[0]) + '</span>' : '') + '</span></span>' +
      '<span class="pprice"><b>' + E.money(pr.price) + '</b>' + (pr.was ? '<s>' + E.money(pr.was) + '</s>' : '') + (pr.pct ? '<span class="ppct">' + pr.pct + '% off</span>' : '') + '</span></button>';
  }

  function emptyBox(title, body) { return '<div class="empty"><b>' + esc(title) + '</b>' + esc(body) + '</div>'; }

  // "Code SAVE20 + Capital One Offers, paid with Venture X"
  function stackSummary(plan) {
    var b = plan.best;
    if (!b) return '';
    var others = b.parts.filter(function (p) { return p.kind !== 'reward'; }).map(function (p) { return p.label; });
    return (others.length ? others.join(' + ') + ', paid with ' : 'Card rewards only, paid with ') + b.card.short;
  }

  function stackRow(dom, plan) {
    var b = plan.best;
    return '<button class="stackrow" data-action="way" data-domain="' + esc(dom) + '"><span class="nm">' + esc(plan.store.name) + '</span>' +
      '<span class="pc">' + E.pctStr(b.totalPct) + '<small>on ' + E.money(plan.amount || 100) + '</small></span>' +
      '<span class="how">' + esc(stackSummary(plan)) + '</span></button>';
  }

  // A sensible order size to show savings on: $100, or the lowest minimum spend when nothing works at $100.
  function sampleAmount(dom, only) {
    var list = only ? [only] : (S.byDomain[dom] || []).filter(function (y) { return usable(y) && y.a.whole && (y.rec.d.kind === 'code' || y.rec.d.kind === 'sale'); });
    if (!list.length) return 100;
    var mins = list.map(function (y) { return y.a.terms.minSpend || 0; });
    if (mins.some(function (m) { return m <= 100; })) return 100;
    var m = Math.min.apply(null, mins);
    return m <= 600 ? m : 100;
  }

  function topStacks(n, filterCat) {
    var rows = Object.keys(S.stacks).map(function (dom) { return [dom, S.stacks[dom]]; }).filter(function (r) {
      var p = r[1];
      if (!p.best || !p.best.total || isHidden(r[0])) return false;
      if (!p.discount && !p.best.parts.some(function (x) { return x.kind === 'offer' || x.kind === 'portal'; })) return false;
      if (filterCat && filterCat !== 'all' && p.store.cat !== filterCat) return false;
      return true;
    });
    rows.sort(function (a, b) { return b[1].best.totalPct - a[1].best.totalPct; });
    return rows.slice(0, n);
  }

  function catCounts(list) {
    var c = {};
    list.forEach(function (x) { c[x.rec.d.cat] = (c[x.rec.d.cat] || 0) + 1; });
    return c;
  }
  function orderCats(counts) {
    var mine = S.settings.categories || [];
    return E.CATEGORIES.filter(function (c) { return counts[c.id]; }).sort(function (a, b) {
      var am = mine.indexOf(a.id) >= 0 ? 0 : 1, bm = mine.indexOf(b.id) >= 0 ? 0 : 1;
      return am - bm || counts[b.id] - counts[a.id];
    });
  }
  function chip(action, val, label, on, n) {
    return '<button class="chip" data-action="' + action + '" data-val="' + esc(val) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + esc(label) + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }
  function sel(id, val, opts, label) {
    return '<select class="input" id="' + id + '" aria-label="' + esc(label) + '">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
  }
  function catOptions(list, val) {
    var counts = catCounts(list);
    return [['all', 'All categories']].concat(orderCats(counts).map(function (c) { return [c.id, c.label + ' (' + counts[c.id] + ')']; }));
  }

  /* ---------------- For You ---------------- */
  function viewForYou() {
    var all = S.items.filter(shown);
    var codes = all.filter(function (x) { return x.rec.d.kind === 'code'; });
    var tested = all.filter(function (x) { return x.a.status === 'tested'; });
    var cats = catCounts(all);
    var mine = S.settings.categories || [];
    var fc = S.fy.cat;
    var recs = S.recs.filter(function (x) { return fc === 'all' || x.rec.d.cat === fc; });
    var bestStack = topStacks(1)[0];
    var h = '<header class="view-head"><h1>For you</h1><p class="sub">' +
      (mine.length ? 'Ranked for ' + mine.map(function (c) { return E.CAT_BY_ID[c] ? E.CAT_BY_ID[c].label : c; }).join(', ') + ', your stores, your list and your cards.' : 'Ranked by real savings, how sure we are they work, your stores, your list and your cards.') + '</p></header>';
    h += '<div class="tally"><div><b>' + codes.filter(working).length + '</b><span>codes that should work</span></div>' +
      '<div><b>' + tested.length + '</b><span>worked at a checkout</span></div>' +
      '<div><b>' + (bestStack ? E.pctStr(bestStack[1].best.totalPct) : '–') + '</b><span>' + (bestStack ? 'best stack, ' + esc(bestStack[1].store.name) : 'best stack') + '</span></div></div>';

    var favs = S.settings.favorites.filter(function (d) { return S.summaries[d] || E.brandByDomain(d); });
    h += '<section><div class="sec-head"><h2>Your stores</h2><button class="more" data-action="tab" data-tab="stores">All stores</button></div><div class="chips flush">' +
      (favs.length ? favs.map(function (d) { var s = S.summaries[d] || { total: 0 }; return '<button class="chip store-chip" data-action="store" data-domain="' + esc(d) + '">' + esc(storeOf(d).name) + '<span class="n">' + s.total + '</span></button>'; }).join('') : '<button class="chip" data-action="tab" data-tab="stores">☆ Star the stores you shop at</button>') + '</div></section>';

    h += '<div class="chips" role="group" aria-label="Category">' + chip('fy-cat', 'all', 'All', fc === 'all') +
      orderCats(cats).map(function (c) { return chip('fy-cat', c.id, c.label, fc === c.id, cats[c.id]); }).join('') +
      (mine.length ? '' : '<button class="chip" data-action="settings" data-focus="cats">Pick your categories…</button>') + '</div>';

    h += '<section><div class="sec-head"><h2>Best matches</h2><span class="hint">savings × reliability × your picks</span></div>';
    h += recs.length ? '<div class="list">' + recs.slice(0, 10).map(function (x) { return couponCard(x, x.why); }).join('') + '</div>' : emptyBox('Nothing here yet', ' Deals show up after the collector runs. Tap the refresh button at the top.');
    h += '</section>';

    var lows = all.filter(function (x) { return x.rec.d.kind === 'product' && x.a.verdict && x.a.verdict.code === 'low' && (fc === 'all' || x.rec.d.cat === fc); })
      .sort(function (a, b) { return (b.rec.d.product.pct || 0) - (a.rec.d.product.pct || 0); });
    if (lows.length) h += '<section><div class="sec-head"><h2>Lowest prices we\'ve seen</h2><span class="hint">tracked over time</span></div><div class="list">' + lows.slice(0, 6).map(function (x) { return productRow(x); }).join('') + '</div></section>';

    var stacks = topStacks(5, fc);
    if (stacks.length) h += '<section><div class="sec-head"><h2>Biggest stacks right now</h2><button class="more" data-action="tab" data-tab="way">Best Way</button></div>' + stacks.map(function (r) { return stackRow(r[0], r[1]); }).join('') + '</section>';
    var soon = all.filter(function (x) { return x.rec.d.kind !== 'product' && x.a.daysLeft != null && x.a.daysLeft <= 3 && working(x) && (fc === 'all' || x.rec.d.cat === fc); })
      .sort(function (a, b) { return a.a.daysLeft - b.a.daysLeft || b.a.score - a.a.score; });
    if (soon.length) h += '<section><div class="sec-head"><h2>Ending soon</h2><span class="hint">3 days or less</span></div><div class="list">' + soon.slice(0, 5).map(function (x) { return couponCard(x); }).join('') + '</div></section>';
    return h;
  }

  /* ---------------- Codes ---------------- */
  function codeList() {
    var c = S.codes;
    var q = c.q.trim().toLowerCase();
    var rankOf = {};
    S.recs.forEach(function (x, i) { rankOf[x.rec.id] = i; });
    var list = S.items.filter(function (x) {
      var d = x.rec.d;
      if (d.kind !== 'code' || isHidden(d.domain)) return false;
      if (x.a.status === 'expired') return false;
      if (c.filter === 'failed') return x.a.status === 'failed';
      if (x.a.status === 'failed') return false;
      if (c.filter === 'whole' && !x.a.whole) return false;
      if (c.filter === 'items' && x.a.whole) return false;
      if (c.filter === 'tested' && x.a.status !== 'tested') return false;
      if (c.filter === 'fav' && !isFav(d.domain)) return false;
      if (c.cat !== 'all' && d.cat !== c.cat) return false;
      if (q) {
        var hay = (d.brand + ' ' + d.title + ' ' + d.code + ' ' + x.a.applies + ' ' + d.domain).toLowerCase();
        if (q.split(/\s+/).some(function (w) { return hay.indexOf(w) < 0; })) return false;
      }
      return true;
    });
    var sorters = {
      best: function (a, b) { var ra = rankOf[a.rec.id], rb = rankOf[b.rec.id]; if (ra == null && rb == null) return b.a.score - a.a.score; if (ra == null) return 1; if (rb == null) return -1; return ra - rb; },
      value: function (a, b) { return E.typicalPct(b.a.terms, b.rec.d) - E.typicalPct(a.a.terms, a.rec.d); },
      reliable: function (a, b) { return b.a.score - a.a.score; },
      ending: function (a, b) { var x = a.a.daysLeft == null ? 999 : a.a.daysLeft, y = b.a.daysLeft == null ? 999 : b.a.daysLeft; return x - y; },
      newest: function (a, b) { return String(b.rec.fs).localeCompare(String(a.rec.fs)); }
    };
    list.sort(sorters[c.sort] || sorters.best);
    return list;
  }

  function codeTicket(x) {
    var d = x.rec.d, a = x.a;
    var cond = conditions(x);
    var go = d.url || (E.brandByDomain(d.domain) || {}).url;
    return '<article class="cticket">' +
      '<button class="cticket-main" data-action="deal" data-id="' + esc(x.rec.id) + '">' +
      '<span class="cticket-top"><span class="cvalue">' + esc(a.terms.headline || 'Code') + '</span>' + statusPill(a) + '</span>' +
      '<span class="ccode">' + esc(d.code) + '</span>' +
      '<span class="applies"><b>Applies to</b> ' + esc(a.applies) + '</span>' +
      (cond ? '<span class="gist">' + esc(cond) + '</span>' : '') + '</button>' +
      '<div class="cticket-actions"><button class="btn sm" data-action="copy" data-val="' + esc(d.code) + '">' + ICON.copy + ' Copy</button>' +
      (go ? '<a class="btn ghost sm" href="' + esc(go) + '" target="_blank" rel="noopener">' + ICON.out + ' Use it</a>' : '') +
      '<button class="btn ghost sm" data-action="deal" data-id="' + esc(x.rec.id) + '">Terms</button></div></article>';
  }

  function viewCodes() {
    var c = S.codes;
    var allCodes = S.items.filter(function (x) { return x.rec.d.kind === 'code' && shown(x); });
    var h = '<header class="view-head"><h1>Coupon codes</h1><p class="sub">Only codes you type at checkout. A code takes money off what the store charges today, so the savings are real. Crossed-out "was" prices can be inflated, so they live under Stores instead.</p></header>';
    h += '<div class="tally"><div><b>' + allCodes.length + '</b><span>codes</span></div><div><b>' + allCodes.filter(function (x) { return x.a.whole; }).length + '</b><span>work on your whole order</span></div><div><b>' + allCodes.filter(function (x) { return x.a.status === 'tested'; }).length + '</b><span>worked at a checkout</span></div></div>';
    h += '<div class="search">' + ICON.search + '<input class="input" id="cq" type="search" placeholder="Search a store, item or code" autocomplete="off" value="' + esc(c.q) + '"></div>';
    h += '<div class="chips" role="group" aria-label="Which codes">' +
      chip('cd-filter', 'all', 'All', c.filter === 'all') + chip('cd-filter', 'whole', 'Whole order', c.filter === 'whole') +
      chip('cd-filter', 'items', 'Certain items', c.filter === 'items') + chip('cd-filter', 'tested', 'Worked at checkout', c.filter === 'tested') +
      chip('cd-filter', 'fav', '★ Your stores', c.filter === 'fav') + chip('cd-filter', 'failed', "Didn't work", c.filter === 'failed') + '</div>';
    h += '<div class="filters two">' + sel('ccat', c.cat, catOptions(allCodes, c.cat), 'Category') +
      sel('csort', c.sort, [['best', 'Best match'], ['value', 'Biggest savings'], ['reliable', 'Most reliable'], ['ending', 'Ending soon'], ['newest', 'Newest']], 'Sort') + '</div>';
    h += '<div id="cresults">' + codeResults() + '</div>';
    return h;
  }

  function codeResults() {
    var list = codeList();
    var c = S.codes;
    var h = '<p class="count">' + plural(list.length, 'code') + '</p>';
    var anyCodes = S.items.some(function (x) { return x.rec.d.kind === 'code' && shown(x); });
    if (!anyCodes && c.filter !== 'failed') return h + emptyBox('No codes yet', ' Codes show up here after the collector reads the stores, when the Gmail scanner finds them in your email, or when you save a store page with the Safari add-on.');
    if (!list.length) return h + emptyBox('No codes match', c.filter === 'tested' ? ' Codes show here after the Safari add-on tests them, or after you mark one as working.' : ' Try another word or a different filter.');
    // Grouped by store, keeping the overall order of stores.
    var groups = [];
    var at = {};
    list.slice(0, c.limit).forEach(function (x) {
      var dom = x.rec.d.domain;
      if (at[dom] == null) { at[dom] = groups.length; groups.push({ dom: dom, items: [] }); }
      groups[at[dom]].items.push(x);
    });
    groups.forEach(function (g) {
      var st = storeOf(g.dom);
      h += '<div class="cgroup"><div class="cgroup-head"><button class="linkish" data-action="store" data-domain="' + esc(g.dom) + '">' + esc(st.name) + ICON.chev + '</button>' + starBtn(g.dom) + '</div>' + g.items.map(codeTicket).join('') + '</div>';
    });
    if (list.length > c.limit) h += '<p class="center"><button class="btn ghost" data-action="cd-more">Show ' + Math.min(30, list.length - c.limit) + ' more</button></p>';
    return h;
  }

  function starBtn(dom) {
    var on = isFav(dom);
    return '<button class="star' + (on ? ' on' : '') + '" data-action="star" data-domain="' + esc(dom) + '" aria-pressed="' + on + '" aria-label="' + (on ? 'Remove from your stores' : 'Add to your stores') + '">' + ICON.star + '</button>';
  }

  /* ---------------- Stores ---------------- */
  function storeList() {
    var st = S.stores;
    var q = st.q.trim().toLowerCase();
    var seen = {};
    var rows = [];
    Object.keys(S.summaries).forEach(function (dom) {
      if (!realDomain(dom) || isHidden(dom)) return;
      var s = S.summaries[dom];
      if (!s.total) return;
      seen[dom] = 1;
      rows.push({ dom: dom, s: s, st: storeOf(dom) });
    });
    S.settings.favorites.forEach(function (dom) { if (!seen[dom] && !isHidden(dom)) { seen[dom] = 1; rows.push({ dom: dom, s: S.summaries[dom] || E.storeSummary(dom, []), st: storeOf(dom) }); } });
    rows = rows.filter(function (r) {
      if (st.filter === 'fav' && !isFav(r.dom)) return false;
      if (st.filter === 'codes' && !r.s.codes) return false;
      if (st.cat !== 'all' && r.st.cat !== st.cat) return false;
      if (q && (r.st.name + ' ' + r.dom).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    rows.sort(function (a, b) { return (isFav(b.dom) ? 1 : 0) - (isFav(a.dom) ? 1 : 0) || (b.s.codes + b.s.offers) - (a.s.codes + a.s.offers) || b.s.total - a.s.total || a.st.name.localeCompare(b.st.name); });
    return rows;
  }

  function storeRow(r) {
    var s = r.s;
    var bits = [];
    if (s.codes) bits.push(plural(s.codes, 'code'));
    if (s.offers) bits.push(plural(s.offers, 'offer'));
    if (s.products) bits.push(s.products + ' on sale');
    if (s.cardOffers) bits.push(plural(s.cardOffers, 'card offer'));
    var right = s.wholePct ? '<span class="pc">' + E.pctStr(Math.round(s.wholePct)) + '<small>off your order</small></span>' : s.bestProductPct ? '<span class="pc">' + s.bestProductPct + '%<small>off items</small></span>' : '<span class="pc muted">–</span>';
    return '<div class="storerow">' + starBtn(r.dom) + '<button class="storerow-main" data-action="store" data-domain="' + esc(r.dom) + '"><span class="nm">' + esc(r.st.name) + '</span><span class="how">' + esc(bits.join(' · ') || 'No deals right now') + '</span></button>' + right + '</div>';
  }

  function viewStores() {
    if (S.stores.view) return viewStore(S.stores.view);
    var st = S.stores;
    var all = S.items.filter(shown);
    var h = '<header class="view-head"><h1>Stores</h1><p class="sub">Every store the app found deals at. Tap one to see all its codes, offers and products on sale, with what each applies to. Star the ones you shop at.</p></header>';
    h += '<div class="search">' + ICON.search + '<input class="input" id="sq" type="search" placeholder="Search stores or deals" autocomplete="off" value="' + esc(st.q) + '"></div>';
    h += '<div class="chips">' + chip('st-filter', 'all', 'All', st.filter === 'all') + chip('st-filter', 'fav', '★ Your stores', st.filter === 'fav', S.settings.favorites.length || null) + chip('st-filter', 'codes', 'Has codes', st.filter === 'codes') + '</div>';
    h += '<div class="filters one">' + sel('scat', st.cat, catOptions(all, st.cat), 'Category') + '</div>';
    h += '<div id="sresults">' + storeResults() + '</div>';
    // Add a store, hidden stores
    h += '<section><div class="sec-head"><h2>Add a store</h2></div><form class="addrow" data-form="addstore"><input class="input" id="addstore" placeholder="Store website, like brooklinen.com" autocomplete="off" autocapitalize="off"><button class="btn" type="submit">Add</button></form><p class="gist" style="margin-top:6px">The collector starts reading it on its next run and stars it for you.</p></section>';
    if (S.settings.hidden.length) h += '<section><div class="sec-head"><h2>Hidden stores</h2></div><div class="chips flush wrap">' + S.settings.hidden.map(function (d) { return '<button class="chip" data-action="unhide" data-domain="' + esc(d) + '">' + esc(storeOf(d).name) + ' · show</button>'; }).join('') + '</div></section>';
    return h;
  }

  function storeResults() {
    var st = S.stores;
    var rows = storeList();
    var h = '';
    var q = st.q.trim().toLowerCase();
    if (q) {
      var deals = S.items.filter(function (x) {
        if (!shown(x)) return false;
        var d = x.rec.d;
        var hay = (d.brand + ' ' + d.title + ' ' + (d.code || '') + ' ' + x.a.applies + ' ' + (d.product ? d.product.name : '')).toLowerCase();
        return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
      }).sort(function (a, b) { return b.a.score * (E.typicalPct(b.a.terms, b.rec.d) + 1) - a.a.score * (E.typicalPct(a.a.terms, a.rec.d) + 1); });
      h += '<p class="count">' + plural(rows.length, 'store') + ' · ' + plural(deals.length, 'deal') + '</p>';
      if (rows.length) h += '<div class="panel flat">' + rows.slice(0, 8).map(storeRow).join('') + '</div>';
      if (deals.length) h += '<section><div class="sec-head"><h2>Matching deals</h2></div><div class="list">' + deals.slice(0, 20).map(function (x) { return couponCard(x); }).join('') + '</div></section>';
      if (!rows.length && !deals.length) h += emptyBox('Nothing matches', ' Try a store name, an item, or add the store below.');
      return h;
    }
    h += '<p class="count">' + plural(rows.length, 'store') + '</p>';
    if (!rows.length) return h + emptyBox(st.filter === 'fav' ? 'No stores starred yet' : 'No stores yet', st.filter === 'fav' ? ' Tap the star next to a store to keep it at the top and get alerts for its new codes.' : ' Stores show up after the collector runs.');
    return h + '<div class="panel flat">' + rows.slice(0, 200).map(storeRow).join('') + '</div>';
  }

  function viewStore(dom) {
    var st = storeOf(dom);
    var items = (S.byDomain[dom] || []).filter(usable);
    var codes = items.filter(function (x) { return x.rec.d.kind === 'code'; }).sort(function (a, b) { return (b.a.whole ? 1 : 0) - (a.a.whole ? 1 : 0) || b.a.score - a.a.score; });
    var offers = items.filter(function (x) { return x.rec.d.kind === 'sale'; });
    var prods = items.filter(function (x) { return x.rec.d.kind === 'product'; });
    var cards = items.filter(function (x) { return x.rec.d.kind === 'cardoffer' || x.rec.d.kind === 'portal'; });
    var plan = S.stacks[dom];
    var report = storeReport(dom);
    var dealsPage = report && report.pages ? (report.pages.filter(function (p) { return p.ok && !/products\.json|api\/|search\/results/.test(p.u); })[1] || {}).u : null;
    var h = '<div class="backbar"><button class="iconbtn" data-action="back" aria-label="Back to stores">' + ICON.back + '</button><span class="eyebrow">Store</span></div>';
    h += '<header class="view-head store-head"><div class="sh-row"><h1>' + esc(st.name) + '</h1>' + starBtn(dom) + '</div>' +
      '<p class="sub">' + [codes.length ? plural(codes.length, 'code') : null, offers.length ? plural(offers.length, 'offer') : null, prods.length ? prods.length + ' products on sale' : null, cards.length ? plural(cards.length, 'card offer') : null].filter(Boolean).join(' · ') + '</p>' +
      '<div class="btnrow" style="margin-top:10px">' + (st.url ? '<a class="btn ghost sm" href="' + esc(st.url) + '" target="_blank" rel="noopener">' + ICON.out + ' Open ' + esc(st.name) + '</a>' : '') +
      (dealsPage ? '<a class="btn ghost sm" href="' + esc(dealsPage) + '" target="_blank" rel="noopener">' + ICON.out + ' Their deals page</a>' : '') +
      '<button class="btn ghost sm" data-action="hide-store" data-domain="' + esc(dom) + '">Hide store</button></div></header>';

    if (plan && plan.best && realDomain(dom)) {
      var sAmt = sampleAmount(dom);
      if (sAmt !== 100) plan = E.planForStore(st, S.byDomain[dom] || [], S.settings, sAmt);
      var b = plan.best;
      h += '<section><div class="sec-head"><h2>Best way to pay</h2><button class="more" data-action="way" data-domain="' + esc(dom) + '" data-amount="' + sAmt + '">Steps</button></div>' +
        '<button class="stackrow" data-action="way" data-domain="' + esc(dom) + '" data-amount="' + sAmt + '"><span class="nm">Save ' + E.money(b.total) + ' on a ' + E.money(sAmt) + ' order</span><span class="pc">' + E.pctStr(b.totalPct) + '<small>total</small></span><span class="how">' + esc(stackSummary(plan)) + '</span></button>' +
        (plan.also && plan.also.length ? '<p class="gist" style="margin-top:6px">Not counted because they only cover some items: ' + esc(plan.also.map(function (a) { return a.text; }).join('; ')) + '.</p>' : '') + '</section>';
    }
    if (codes.length) h += '<section><div class="sec-head"><h2>Coupon codes</h2><span class="hint">type these at checkout</span></div>' + codes.map(codeTicket).join('') + '</section>';
    if (offers.length) {
      // Group by what they apply to.
      var groups = {};
      var order = [];
      offers.sort(function (a, b) { return (b.a.whole ? 1 : 0) - (a.a.whole ? 1 : 0) || E.typicalPct(b.a.terms, b.rec.d) - E.typicalPct(a.a.terms, a.rec.d); }).forEach(function (x) {
        var g = x.a.whole ? 'Storewide offers' : 'Offers on certain items';
        if (!groups[g]) { groups[g] = []; order.push(g); }
        groups[g].push(x);
      });
      order.forEach(function (g) { h += '<section><div class="sec-head"><h2>' + esc(g) + '</h2><span class="hint">no code needed</span></div><div class="list">' + groups[g].map(function (x) { return couponCard(x); }).join('') + '</div></section>'; });
    }
    if (prods.length) {
      var sort = S.stores.prodSort;
      prods.sort(function (a, b) {
        var pa = a.rec.d.product, pb = b.rec.d.product;
        if (sort === 'price') return pa.price - pb.price;
        if (sort === 'verdict') return verdictRank(b) - verdictRank(a) || (pb.pct || 0) - (pa.pct || 0);
        return (pa.stock === 'out') - (pb.stock === 'out') || (pb.pct || 0) - (pa.pct || 0);
      });
      var secs = {};
      prods.forEach(function (x) { var s = x.rec.d.section || 'On sale'; secs[s] = (secs[s] || 0) + 1; });
      h += '<section><div class="sec-head"><h2>Products on sale</h2><span class="hint">' + prods.length + ' items</span></div>' +
        '<p class="gist" style="margin:-4px 0 10px">The store\'s own "was" prices. The badge tells you whether the app has seen this price before.</p>' +
        '<div class="filters one">' + sel('psort', sort, [['pct', 'Biggest % off'], ['verdict', 'Real price drops first'], ['price', 'Lowest price']], 'Sort products') + '</div>' +
        '<div class="list">' + prods.slice(0, S.stores.prodLimit).map(function (x) { return productRow(x); }).join('') + '</div>' +
        (prods.length > S.stores.prodLimit ? '<p class="center"><button class="btn ghost" data-action="prod-more">Show more</button></p>' : '') + '</section>';
    }
    if (cards.length) h += '<section><div class="sec-head"><h2>Card offers</h2></div><div class="list">' + cards.map(function (x) { return couponCard(x); }).join('') + '</div></section>';
    if (!items.length) h += emptyBox('No deals right now', report && !report.ok ? ' ' + st.name + ' blocks automated visits, so the collector can\'t read it. Open their deals page in Safari and tap the Deal Stack button to save what\'s there.' : ' Nothing was found on its pages on the last run.');
    h += '<section><div class="sec-head"><h2>Where the app looked</h2></div>' + lookedBlock(dom, report) + '</section>';
    return h;
  }

  function sourceWords(d, name) {
    name = name || d.brand;
    if (d.sourceType === 'official') return d.sourceName && !/website$/i.test(d.sourceName) ? d.sourceName : name + "'s own website";
    if (d.sourceType === 'email') return d.sourceName || 'your Gmail';
    if (d.sourceType === 'card') return d.sourceName || 'your card offers';
    if (d.sourceType === 'capture') return 'a page you saved in Safari';
    return d.sourceName || 'a deal site';
  }

  function verdictRank(x) { var v = x.a.verdict; return !v ? 0 : v.code === 'low' ? 3 : v.code === 'steady' ? 2 : v.code === 'new' ? 1 : v.code === 'higher' ? -1 : -2; }

  function storeReport(dom) {
    var col = S.raw && S.raw.status && S.raw.status.collector;
    if (!col || !col.details) return null;
    for (var i = 0; i < col.details.length; i++) if (col.details[i].domain === dom) return Object.assign({ runAt: col.runAt }, col.details[i]);
    return null;
  }

  function lookedBlock(dom, report) {
    if (!report) {
      var srcs = {}, pages = {};
      var name = storeOf(dom).name;
      (S.byDomain[dom] || []).forEach(function (x) {
        var d = x.rec.d;
        srcs[sourceWords(d, name)] = 1;
        var u = d.pageUrl || (d.sourceType === 'official' ? d.url : null);
        if (u) pages[u] = 1;
      });
      var pl = Object.keys(pages);
      return '<p class="gist">These deals came from ' + esc(Object.keys(srcs).join(', ') || 'nowhere yet') + '.</p>' +
        (pl.length ? '<div class="src-list">' + pl.slice(0, 12).map(function (u) { return '<div><i class="ok"></i><span class="mono"><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(shortHost(u)) + '</a></span></div>'; }).join('') + '</div>' : '');
    }
    return '<p class="gist">Last checked ' + esc(E.agoText(E.hoursSince(report.runAt, new Date()))) + '. ' + esc(report.note || '') + '</p>' +
      '<div class="src-list">' + (report.pages || []).map(function (p) { return '<div><i class="' + (p.ok ? 'ok' : '') + '"></i><span class="mono">' + esc(shortHost(p.u)) + '<small>' + esc(p.n || '') + '</small></span></div>'; }).join('') + '</div>';
  }

  /* ---------------- Best Way ---------------- */
  function allStores() {
    var seen = {};
    var out = [];
    Object.keys(S.byDomain).forEach(function (dom) {
      if (!realDomain(dom)) return;
      seen[dom] = 1;
      out.push({ domain: dom, name: storeOf(dom).name, n: S.byDomain[dom].filter(usable).length, pseudo: false });
    });
    E.BRANDS.forEach(function (b) { if (!seen[b.domain]) { seen[b.domain] = 1; out.push({ domain: b.domain, name: b.name, n: 0, pseudo: b.pseudo }); } });
    return out;
  }
  function suggestions(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    var nq = E.normName(q);
    return allStores().filter(function (s) { return s.name.toLowerCase().indexOf(q) >= 0 || E.normName(s.name).indexOf(nq) >= 0 || s.domain.indexOf(q) >= 0; })
      .sort(function (a, b) { var as = a.name.toLowerCase().indexOf(q) === 0 ? 0 : 1, bs = b.name.toLowerCase().indexOf(q) === 0 ? 0 : 1; return as - bs || b.n - a.n || a.name.localeCompare(b.name); })
      .slice(0, 8);
  }
  function viewWay() {
    var w = S.way;
    var st = w.domain ? storeOf(w.domain) : null;
    var h = '<header class="view-head"><h1>Best way to pay</h1><p class="sub">Pick where you\'re shopping and how much. You get the steps, in order, that save the most with your codes, offers and cards. Only deals that cover your whole order are counted.</p></header>';
    h += '<div class="waygrid"><div class="picker"><label class="lbl" for="wayq">Store</label><input class="input" id="wayq" type="search" autocomplete="off" placeholder="Search stores" value="' + esc(w.q || (st ? st.name : '')) + '"><div class="suggest" id="waysug" hidden></div></div>' +
      '<div class="amount"><label class="lbl" for="wayamt">Spending</label><div style="position:relative"><span>$</span><input class="input" id="wayamt" type="number" inputmode="decimal" min="1" step="1" value="' + esc(w.amount) + '"></div></div></div>';
    var quick = E.BRANDS.filter(function (b) { return b.pseudo; }).slice(0, 7);
    h += '<div class="quick">' + quick.map(function (b) { return '<button class="chip" data-action="way" data-domain="' + esc(b.domain) + '" aria-pressed="' + (w.domain === b.domain) + '">' + esc(b.name) + '</button>'; }).join('') + '</div>';
    h += '<div id="wayplan">' + (st ? planBlock(st) : '') + '</div>';
    var stacks = topStacks(6);
    if (stacks.length) h += '<section><div class="sec-head"><h2>Top stacks right now</h2><span class="hint">on a $100 order</span></div>' + stacks.map(function (r) { return stackRow(r[0], r[1]); }).join('') + '</section>';
    h += '<section><div class="sec-head"><h2>Rules that save the most</h2></div><div class="rules">' + E.RULES.map(function (r) { return '<div class="rule"><b>' + esc(r.t) + '</b><p>' + esc(r.b) + '</p></div>'; }).join('') + '</div></section>';
    return h;
  }
  function planBlock(st) {
    var items = S.byDomain[st.domain] || [];
    var amt = Math.max(1, Number(S.way.amount) || 100);
    var plan = E.planForStore(st, items, S.settings, amt);
    var b = plan.best;
    if (!b) return emptyBox('Add your cards first', ' Turn on the cards you carry in the Cards tab.');
    var charged = amt - (plan.discount ? plan.discount.value : 0);
    var back = b.total - (plan.discount ? plan.discount.value : 0);
    var h = '<div class="plan"><div class="plan-top"><div class="eyebrow">' + esc(st.name) + ' · ' + E.money(amt) + ' order</div>' +
      '<div class="plan-save"><span class="big"><span class="mark">' + E.money(b.total) + '</span></span><span class="of">saved, ' + E.pctStr(b.totalPct) + ' of your order</span></div>' +
      '<div class="plan-pay">You\'re charged ' + E.money(charged) + (back > 0 ? '. ' + E.money(back) + ' comes back later as rewards.' : '.') + '</div></div>';
    h += '<div class="plan-body"><ol class="steps">' + b.steps.map(function (s) { return '<li><span>' + esc(s) + '</span></li>'; }).join('') + '</ol>';
    h += '<div class="parts">' + b.parts.map(function (p) { return '<div><span>' + esc(p.label) + '</span><span>' + E.money(p.amt) + '</span></div>'; }).join('') +
      '<div class="tot"><span>Total saved</span><span>' + E.money(b.total) + '</span></div></div>';
    var notes = plan.warnings.map(function (w) { return '<div class="note warnnote">' + esc(w) + '</div>'; })
      .concat((plan.also || []).map(function (a) { return '<div class="note">Also here, if your cart has those items: ' + esc(a.text) + '.</div>'; }))
      .concat(b.notes.map(function (n) { return '<div class="note">' + esc(n) + '</div>'; }));
    if (notes.length) h += '<div class="notes">' + notes.join('') + '</div>';
    if (plan.options.length > 1) {
      h += '<details><summary>Other ways to pay</summary><div class="alts" style="margin-top:8px">' + plan.options.slice(1).map(function (o) {
        return '<div><span>' + esc(o.card.short) + '</span><span>' + E.money(o.total) + ' · ' + E.pctStr(o.totalPct) + '</span></div>';
      }).join('') + '</div></details>';
    }
    h += '</div></div>';
    if (!st.pseudo && items.filter(usable).length) h += '<p style="margin-top:12px"><button class="btn ghost sm" data-action="store" data-domain="' + esc(st.domain) + '">All deals at ' + esc(st.name) + ICON.chev + '</button></p>';
    else if (!st.pseudo) h += '<p class="count">No coupons for ' + esc(st.name) + ' right now. The card advice above still applies.</p>';
    return h;
  }

  /* ---------------- My List ---------------- */
  function viewList() {
    var plan = S.settings.plan || [];
    var h = '<header class="view-head"><h1>My list</h1><p class="sub">Things you plan to buy. The app watches for deals on them, moves matches to the top of For You, and can alert you.</p></header>';
    h += '<form class="addrow" data-form="plan"><input class="input" id="planq" placeholder="A store, an item, or a type of thing" autocomplete="off"><button class="btn" type="submit">Add</button></form>';
    var mine = plan.filter(function (p) { return p.type === 'category'; }).map(function (p) { return p.cat; });
    h += '<div class="chips">' + E.CATEGORIES.filter(function (c) { return c.id !== 'general' && mine.indexOf(c.id) < 0; }).map(function (c) { return '<button class="chip" data-action="plan-cat" data-val="' + c.id + '">+ ' + esc(c.label) + '</button>'; }).join('') + '</div>';
    if (!plan.length) return h + '<section>' + emptyBox('Your list is empty', ' Add something like "running shoes", "Costco" or "air fryer".') + '</section>';
    h += '<section>';
    plan.forEach(function (item, i) {
      var all = S.items.filter(shown).map(function (x) { var hm = E.planMatches([item], x.rec); return hm.length ? { x: x, loose: !!hm[0].loose } : null; }).filter(Boolean);
      var exact = all.filter(function (m) { return !m.loose; }).map(function (m) { return m.x; });

  function stashChips() {

  function ocrBlock() {

  /* ---------------- alerts ---------------- */
  function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }

    }).catch(function () { S.push.state = 'unavailable'; });
  }
  function alertsBlock() {
    var a = S.settings.alerts;
    var h = '<div class="block"><h4>Alerts</h4><p class="gist" style="margin:0 0 8px">Your phone gets a notification when something on My List goes on sale, a new code shows up at one of your starred stores, or a saved card offer is about to expire. Checked every 6 hours.</p>';
    if (S.demo) h += '<p class="gist">Alerts work in your launched app.</p>';
    else if (!pushSupported() || !standalone()) h += '<div class="banner">On iPhone, alerts need the app on your Home Screen: in Safari tap Share, then Add to Home Screen, then open Deal Stack from that icon and come back here.</div>';
    else if (S.push.state === 'on') h += '<p class="gist"><b>Alerts are on</b> for this phone.</p><div class="btnrow"><button class="btn ghost sm" data-action="alerts-test">Send a test alert</button><button class="btn ghost sm" data-action="alerts-off">Turn off</button></div>';
    else h += '<button class="btn" data-action="alerts-on">Turn on alerts</button>';
    h += '<div class="toggles">' + [['list', 'Deals on My List'], ['favorites', 'New codes at your starred stores'], ['expiring', 'Card offers ending within 3 days']].map(function (t) {
      return '<label class="tog"><span>' + esc(t[1]) + '</span><span class="switch"><input type="checkbox" data-change="alert-pref" data-key="' + t[0] + '"' + (a[t[0]] !== false ? ' checked' : '') + '><span></span></span></label>';
    }).join('') + '</div></div>';
    return h;
  }
  function b64ToBytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function alertsOn() {
    Notification.requestPermission().then(function (perm) {
      if (perm !== 'granted') { toast('Alerts are blocked. Allow them in iPhone Settings, Notifications, Deal Stack.'); return; }
      return navigator.serviceWorker.register('/sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
        return api('/api/push/key').then(function (k) {
          if (!k.ok) throw new Error(k.error || 'no key');
          return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(k.key) });
        });
      }).then(function (sub) {
        return api('/api/push/subscribe', { method: 'POST', body: { subscription: sub.toJSON() } });
      }).then(function (j) {
        if (!j.ok) throw new Error(j.error);
        S.push.state = 'on'; paintSheet(); toast('Alerts are on');
        return api('/api/push/test', { method: 'POST' });
      });
    }).catch(function (e) { toast("Couldn't turn on alerts: " + (e && e.message ? e.message : 'unknown problem')); });
  }
  function alertsOff() {

      if (!sub) return;

      return sub.unsubscribe().then(function () { return api('/api/push/unsubscribe', { method: 'POST', body: { endpoint: ep } }); });
    }).then(function () { S.push.state = 'off'; paintSheet(); toast('Alerts are off'); });
  }

  function loadScript(src) {

  function saveOcr() {
    var prog = S.ocrProgram;
    var rows = (S.ocr && S.ocr.rows || []).filter(function (r) { return r.include && r.merchant; });
    if (!rows.length) return;
    var now = new Date();

        domain: g.domain, brand: g.brand ? g.brand.name : r.merchant, kind: prog === 'c1shopping' ? 'portal' : 'cardoffer',
        card: prog === 'c1shopping' ? null : prog, portal: prog === 'c1shopping' ? 'c1shopping' : null,
        title: title, terms: r.raw || '', sourceType: 'card', sourceName: (E.PROGRAMS[prog] || {}).name, guessed: g.guessed
      }, now);
