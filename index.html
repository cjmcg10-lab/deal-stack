<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deal Stack</title>
<meta name="description" content="Your coupons, card offers and the best way to pay, in one place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deal Stack">
<meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F15" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; coupon "tickets" with a torn stub; sticky top bar and a bottom tab bar. */
:root {
  --paper: #EEF0F3;
  --card: #FFFFFF;
  --ink: #121722;
  --ink-2: #4B5468;
  --ink-3: #7A8396;
  --line: #D8DCE4;
  --marker: #FFD43B;
  --marker-ink: #1A1500;
  --tint: #E4E8EF;
  --offer: #DCE6FF;
  --offer-ink: #1E3F99;
  --portal: #D9F2E6;
  --portal-ink: #155C3E;
  --good: #1E7F52;
  --good-bg: #DDF3E7;
  --info: #2756C8;
  --info-bg: #E1E9FC;
  --warn: #9A5B0C;
  --warn-bg: #FBEBD3;
  --mute: #5F6778;
  --mute-bg: #E6E8ED;
  --bad: #B33A27;
  --bad-bg: #F8E1DC;
  --shadow: 0 1px 0 rgba(18, 23, 34, .06), 0 8px 24px -14px rgba(18, 23, 34, .25);
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C0F15; --card: #161B25; --ink: #EDF0F5; --ink-2: #B0B8C8; --ink-3: #848DA0; --line: #2A3141;
    --marker: #FFD43B; --marker-ink: #1A1500; --tint: #212838; --offer: #1C2B52; --offer-ink: #AFC4FF;
    --portal: #163527; --portal-ink: #9BE0BE; --good: #5CD39A; --good-bg: #133324; --info: #8FB0FF; --info-bg: #1A2747;
    --warn: #F2B35E; --warn-bg: #3A2A12; --mute: #A3AABA; --mute-bg: #232A38; --bad: #FF8E7A; --bad-bg: #3D1C17;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 10px 26px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C0F15; --card: #161B25; --ink: #EDF0F5; --ink-2: #B0B8C8; --ink-3: #848DA0; --line: #2A3141;
  --marker: #FFD43B; --marker-ink: #1A1500; --tint: #212838; --offer: #1C2B52; --offer-ink: #AFC4FF;
  --portal: #163527; --portal-ink: #9BE0BE; --good: #5CD39A; --good-bg: #133324; --info: #8FB0FF; --info-bg: #1A2747;
  --warn: #F2B35E; --warn-bg: #3A2A12; --mute: #A3AABA; --mute-bg: #232A38; --bad: #FF8E7A; --bad-bg: #3D1C17;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 10px 26px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
a { color: var(--info); }

.app { max-width: 600px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  margin: 0 -16px; padding: 10px 16px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.logo { display: flex; align-items: center; gap: 8px; font: 700 22px/1 var(--f-display); letter-spacing: .01em; }
.logo svg { width: 26px; height: 26px; flex: none; }
.topbar .spacer { flex: 1; }
.iconbtn {
  width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
}
.iconbtn svg { width: 19px; height: 19px; }
.iconbtn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.banner {
  margin: 12px 0 0; padding: 10px 12px; border-radius: 12px;
  background: var(--warn-bg); color: var(--warn); font-size: 13.5px; line-height: 1.4;
}
.banner b { color: inherit; }

/* Headings */
.view-head { padding: 18px 0 6px; }
.view-head h1 { margin: 0; font: 700 34px/1.02 var(--f-display); letter-spacing: .005em; text-wrap: balance; }
.view-head .sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
section { margin-top: 22px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
.sec-head h2 { margin: 0; font: 700 21px/1.1 var(--f-display); letter-spacing: .01em; }
.sec-head .hint { color: var(--ink-3); font-size: 12.5px; }
.sec-head .more { margin-left: auto; font-size: 13px; color: var(--info); background: none; border: 0; padding: 0; }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }

/* Summary strip */
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.tally div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 9px; min-width: 0; }
.tally b { display: block; font: 700 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tally span { display: block; margin-top: 3px; color: var(--ink-2); font-size: 12px; line-height: 1.25; }

/* Chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 12px -16px 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink-2); font-size: 13.5px; font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .n { margin-left: 5px; opacity: .65; font-variant-numeric: tabular-nums; }

/* Coupon ticket */
.list { display: flex; flex-direction: column; gap: 10px; }
.coupon {
  position: relative; display: grid; grid-template-columns: 86px 1fr; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 0;
  box-shadow: var(--shadow); overflow: hidden;
}
.coupon::before, .coupon::after {
  content: ''; position: absolute; left: 77px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--paper); border: 1px solid var(--line);
}
.coupon::before { top: -10px; }
.coupon::after { bottom: -10px; }
.stub {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  padding: 12px 6px; border-right: 2px dashed var(--line); min-height: 100%;
  background: var(--marker); color: var(--marker-ink);
}
.stub[data-kind="sale"] { background: var(--tint); color: var(--ink); }
.stub[data-kind="cardoffer"] { background: var(--offer); color: var(--offer-ink); }
.stub[data-kind="portal"] { background: var(--portal); color: var(--portal-ink); }
.stub .pre { font: 600 9.5px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.stub .big { font: 700 31px/.95 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stub .big.sm { font-size: 22px; }
.stub .unit { font: 700 12px/1 var(--f-display); letter-spacing: .14em; }
.cbody { padding: 11px 13px 11px 15px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand { font-weight: 700; font-size: 14.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctitle { color: var(--ink); font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gist { color: var(--ink-2); font-size: 12.5px; line-height: 1.35; }
.row3 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
.codetag {
  font: 600 12px/1 var(--f-mono); letter-spacing: .04em; padding: 4px 7px; border-radius: 6px;
  border: 1.5px dashed var(--ink-3); color: var(--ink);
}
.cattag { font-size: 11.5px; color: var(--ink-3); }
.why { font-size: 11.5px; color: var(--good); font-weight: 600; }

/* Status pill */
.status { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status .sc { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 500; }
.s-tested { background: var(--good-bg); color: var(--good); }
.s-official { background: var(--info-bg); color: var(--info); }
.s-likely { background: var(--warn-bg); color: var(--warn); }
.s-unconfirmed { background: var(--mute-bg); color: var(--mute); }
.s-failed, .s-expired { background: var(--bad-bg); color: var(--bad); }

/* Stacks list */
.stackrow {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px;
}
.stackrow + .stackrow { margin-top: 8px; }
.stackrow .nm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stackrow .pc { grid-row: span 2; font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: right; }
.stackrow .pc small { display: block; font: 500 11px/1.2 var(--f-body); color: var(--ink-3); letter-spacing: 0; }
.stackrow .how { color: var(--ink-2); font-size: 12.5px; min-width: 0; }
.mark { background: linear-gradient(transparent 55%, var(--marker) 55%); padding: 0 2px; color: inherit; }
:root[data-theme="dark"] .mark { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--marker) 45%, transparent) 55%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mark { background: linear-gradient(transparent 55%, color-mix(in srgb, var(--marker) 45%, transparent) 55%); } }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.input, select.input {
  width: 100%; min-width: 0; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font-size: 16px;
}
.search { position: relative; margin-top: 12px; }
.search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--ink-3); }
.search .input { padding-left: 38px; }
.filters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.filters select { padding: 9px 8px; font-size: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 16px; border-radius: 12px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 600; font-size: 15px; text-decoration: none;
}
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
.btn.sm { padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.count { color: var(--ink-3); font-size: 12.5px; margin: 12px 0 8px; }
.empty { padding: 26px 16px; text-align: center; color: var(--ink-2); background: var(--card); border: 1px dashed var(--line); border-radius: var(--r); }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; }

/* Best way */
.picker { position: relative; }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 15; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-height: 280px; overflow-y: auto; }
.suggest button { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 11px 14px; border: 0; background: none; text-align: left; border-bottom: 1px solid var(--line); }
.suggest button:last-child { border-bottom: 0; }
.suggest small { color: var(--ink-3); }
.waygrid { display: grid; grid-template-columns: 1fr 120px; gap: 8px; margin-top: 12px; }
.amount { position: relative; }
.amount span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.amount .input { padding-left: 24px; font-variant-numeric: tabular-nums; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.plan { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
.plan-top { padding: 16px 16px 14px; border-bottom: 2px dashed var(--line); }
.plan-top .eyebrow { margin-bottom: 6px; }
.plan-save { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.plan-save .big { font: 700 46px/.95 var(--f-display); font-variant-numeric: tabular-nums; }
.plan-save .of { color: var(--ink-2); font-size: 14px; }
.plan-pay { margin-top: 6px; color: var(--ink-2); font-size: 13px; }
.plan-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 700 14px/1 var(--f-display); }
.parts { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.parts div { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.parts div span:first-child { color: var(--ink-2); min-width: 0; }
.parts div span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
.parts .tot { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 700; }
.parts .tot span:first-child { color: var(--ink); }
.notes { display: flex; flex-direction: column; gap: 6px; }
.note { font-size: 12.5px; color: var(--ink-2); padding-left: 12px; border-left: 3px solid var(--line); }
.note.warnnote { border-color: var(--marker); color: var(--ink); }
.alts { display: flex; flex-direction: column; gap: 4px; }
.alts div { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.alts div:last-child { border-bottom: 0; }
.alts span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-2); }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.rules { display: flex; flex-direction: column; gap: 8px; }
.rule { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.rule b { display: block; margin-bottom: 3px; }
.rule p { margin: 0; color: var(--ink-2); font-size: 13.5px; }

/* My list */
.addrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
.planitem { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.planitem + .planitem { margin-top: 10px; }
.planitem .ph { display: flex; align-items: center; gap: 10px; }
.planitem .ph b { flex: 1; min-width: 0; }
.planitem .ph small { color: var(--ink-3); }
.planitem .pm { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.x { border: 0; background: none; color: var(--ink-3); padding: 4px 6px; font-size: 13px; }

/* Cards tab */
.wallet { display: flex; flex-direction: column; gap: 10px; }
.wcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px; }
.wcard .wh { display: flex; align-items: center; gap: 10px; }
.wcard .wh b { flex: 1; min-width: 0; }
.wcard ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
.wcard ul li + li { margin-top: 2px; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; inset: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span::after { transform: translateX(18px); }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.progrow { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.progrow:last-child { border-bottom: 0; }
.progrow div { flex: 1; min-width: 0; }
.progrow small { display: block; color: var(--ink-3); font-size: 12px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 14px; }
.panel.pad { padding: 14px; }
.brandpick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-height: 210px; overflow-y: auto; }
.ocr-row { display: grid; grid-template-columns: 22px 1fr 70px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ocr-row .input { padding: 8px 10px; font-size: 15px; }

/* Sheet */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 15, .45); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 600px; margin: 0 auto;
  max-height: calc(92% - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); border-radius: 22px 22px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 40px -10px rgba(0,0,0,.35);
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 10px; }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; }
.sheet-head h3 { margin: 0; flex: 1; font: 700 26px/1.05 var(--f-display); text-wrap: balance; }
.detail-val { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.detail-val .stub { border-radius: 12px; border-right: 0; padding: 12px 14px; min-width: 92px; min-height: 0; }
.detail-val .gist { font-size: 14px; }
.codebox { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px; border-radius: 14px; border: 2px dashed var(--ink-3); background: var(--card); }
.codebox code { flex: 1; min-width: 0; font: 600 22px/1.1 var(--f-mono); letter-spacing: .06em; overflow-wrap: anywhere; }
.block { margin-top: 16px; }
.block h4 { margin: 0 0 8px; font: 700 18px/1.1 var(--f-display); letter-spacing: .01em; }
.bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.bullets li { position: relative; padding-left: 20px; font-size: 14.5px; }
.bullets li::before { content: ''; position: absolute; left: 3px; top: .55em; width: 7px; height: 7px; border-radius: 2px; background: var(--ink); transform: rotate(45deg); }
.reasons { display: flex; flex-direction: column; gap: 6px; }
.reasons div { display: flex; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.reasons div::before { content: ''; flex: none; width: 8px; height: 8px; margin-top: .45em; border-radius: 50%; background: var(--mute); }
.reasons div.good::before { background: var(--good); }
.reasons div.bad::before { background: var(--bad); }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 6px 0 10px; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.fullterms { margin-top: 8px; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.toggle-terms { margin-top: 10px; background: none; border: 0; padding: 0; color: var(--info); font-weight: 600; font-size: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.src-list { display: flex; flex-direction: column; font-size: 13px; }
.src-list div { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.src-list i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--bad); }
.src-list i.ok { background: var(--good); }
.src-list span small { display: block; color: var(--ink-3); }
.mono { font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border: 0; background: none; color: var(--ink-3); font-size: 11px; font-weight: 600; border-radius: 10px; }
.tabbar svg { width: 23px; height: 23px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"] svg { color: var(--ink); }
.tabbar button[aria-current="page"] .tb-dot { background: var(--marker); }
.tb-ico { position: relative; }
.tb-dot { position: absolute; right: -5px; top: -2px; width: 8px; height: 8px; border-radius: 50%; background: transparent; }

.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; box-shadow: var(--shadow);
}
.connect { padding-top: 40px; display: flex; flex-direction: column; gap: 14px; }
.connect h1 { margin: 0; font: 700 40px/1 var(--f-display); }
.connect p { margin: 0; color: var(--ink-2); }
.err { color: var(--bad); font-size: 13.5px; }
.loading { padding: 60px 0; text-align: center; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 640px) { .app { padding-left: 24px; padding-right: 24px; } }

</style>
</head>
<body>
<div id="app" class="app"></div>
<nav id="tabbar" class="tabbar" aria-label="Sections" hidden></nav>
<div id="sheethost"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="engine.js"></script>
<script>
/* Deal Stack app. Runs in Safari / as a home-screen app, talking to your private hub. */
(function () {
  'use strict';
  var E = window.DealEngine;
  var PREVIEW = !!window.DEALSTACK_PREVIEW;
  var OCR_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

  /* ---------------- helpers ---------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var mem = {};
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('dealstack.' + k); return v == null ? (k in mem ? mem[k] : d) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } },
    set: function (k, v) { mem[k] = v; try { localStorage.setItem('dealstack.' + k, JSON.stringify(v)); } catch (e) { } },
    del: function (k) { delete mem[k]; try { localStorage.removeItem('dealstack.' + k); } catch (e) { } }
  };
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var ICON = {
    logo: '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="2.5" width="18" height="9" rx="2.5" fill="currentColor" opacity=".28"/><rect x="4.5" y="7.5" width="23" height="10" rx="2.8" fill="currentColor" opacity=".55"/><path d="M3 15.5a3 3 0 0 1 3-3h20a3 3 0 0 1 3 3v2.6a2.6 2.6 0 0 0 0 5.2v2.7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-2.7a2.6 2.6 0 0 0 0-5.2z" fill="var(--marker)" stroke="currentColor" stroke-width="1.6"/><path d="M12 19.5l8-0M12 23.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3.5M4 4v4h4M4 13a8 8 0 0 0 14.9 3.5M20 20v-4h-4"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    foryou: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.4 5.4 5.6.6-4.2 3.9 1.2 5.6L12 15.6 7 18.5l1.2-5.6L4 9l5.6-.6z"/></svg>',
    browse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3.5a2.5 2.5 0 0 0 0 5V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3.5a2.5 2.5 0 0 0 0-5z"/><path d="M9.5 4v16" stroke-dasharray="2 2.2"/></svg>',
    way: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l9-9-4-4-9 9z"/><path d="M13 7l4 4"/><path d="M15 3h6v6"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L6.8 5M3.5 12l1.2 1.2 2.1-2.2M3.5 18l1.2 1.2 2.1-2.2"/></svg>',
    cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/></svg>',
    copy: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
    out: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    close: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  var TABS = [
    { id: 'foryou', label: 'For You' },
    { id: 'browse', label: 'Browse' },
    { id: 'way', label: 'Best Way' },
    { id: 'list', label: 'My List' },
    { id: 'cards', label: 'Cards' }
  ];

  /* ---------------- state ---------------- */
  var S = {
    mode: 'loading',
    live: false,
    demo: false,
    key: store.get('key', ''),
    raw: null,
    items: [], byId: {}, byDomain: {}, stacks: {}, extras: {}, recs: [],
    settings: mergeSettings(store.get('settings', null)),
    tab: store.get('tab', 'foryou'),
    fy: { cat: 'all' },
    browse: { q: '', cats: [], status: 'working', type: 'all', sort: 'best', limit: 40 },
    way: { domain: store.get('wayDomain', null), amount: store.get('wayAmount', 100), q: '' },
    listOpen: {},
    sheet: null,
    ocr: null,
    ocrProgram: 'venmo',
    stashQ: '',
    busy: false
  };
  if (!TABS.some(function (t) { return t.id === S.tab; })) S.tab = 'foryou';

  function mergeSettings(s) {
    var base = clone(E.DEFAULT_SETTINGS);
    if (!s || typeof s !== 'object') return base;
    Object.keys(s).forEach(function (k) { base[k] = s[k]; });
    if (!base.stash || typeof base.stash !== 'object') base.stash = { tier: 1, brands: [] };
    if (!Array.isArray(base.stash.brands)) base.stash.brands = [];
    if (!Array.isArray(base.cards)) base.cards = clone(E.DEFAULT_SETTINGS.cards);
    if (!Array.isArray(base.categories)) base.categories = [];
    if (!Array.isArray(base.plan)) base.plan = [];
    return base;
  }

  var saveTimer = null;
  function saveSettings() {
    store.set('settings', S.settings);
    computeStacks();
    if (!S.live || !S.key) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { api('/api/settings', { method: 'PUT', body: { settings: S.settings } }); }, 600);
  }

  /* ---------------- talking to the hub ---------------- */
  function api(path, opts) {
    opts = opts || {};
    var headers = { 'content-type': 'application/json' };
    if (S.key) headers['x-hub-key'] = S.key;
    return fetch(path, { method: opts.method || 'GET', headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store' })
      .then(function (r) {
        return r.text().then(function (t) {
          var j; try { j = JSON.parse(t); } catch (e) { j = { ok: false, error: 'Unexpected reply from the hub (' + r.status + ').' }; }
          j._status = r.status; return j;
        });
      });
  }

  function boot() {
    if (PREVIEW) return startDemo();
    render();
    fetch('/api/ping', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (p) {
      if (!p || p.app !== 'deal-stack') return startDemo();
      S.live = true;
      S.ping = p;
      if (!S.key) { S.mode = 'connect'; render(); return; }
      var cached = store.get('cache', null);
      if (cached && cached.deals) { S.raw = cached; S.mode = 'ready'; derive(); render(); }
      load();
    }).catch(startDemo);
  }

  function load(manual) {
    S.busy = true; paintTopbar();
    api('/api/deals').then(function (j) {
      S.busy = false;
      if (j._status === 401) { S.mode = 'connect'; S.connectErr = "That key doesn't match the APP_KEY in Cloudflare."; render(); return; }
      if (!j.ok) { paintTopbar(); toast(j.error || 'Could not load deals.'); if (!S.raw) { S.raw = { deals: [], tests: [], sight: {}, status: {} }; S.mode = 'ready'; derive(); render(); } return; }
      S.raw = j;
      if (j.settings) { S.settings = mergeSettings(j.settings); store.set('settings', S.settings); }
      else if (S.live) api('/api/settings', { method: 'PUT', body: { settings: S.settings } });
      S.mode = 'ready';
      derive(); render();
      if (manual) toast('Updated: ' + S.items.filter(usable).length + ' deals you can use');
      try { var txt = JSON.stringify(j); if (txt.length < 2500000) store.set('cache', j); } catch (e) { }
    }).catch(function () {
      S.busy = false; paintTopbar();
      toast(S.raw ? 'No connection. Showing your saved deals.' : 'Could not reach your hub.');
      if (!S.raw) { S.mode = 'connect'; S.connectErr = 'Could not reach your hub. Check your connection and try again.'; render(); }
    });
  }

  function startDemo() {
    S.demo = true; S.live = false; S.mode = 'ready';
    S.raw = sampleData(new Date());
    var saved = store.get('settings', null);
    S.settings = mergeSettings(saved || S.raw.settings);
    derive(); render();
  }

  /* ---------------- deriving what to show ---------------- */
  function usable(x) { return x.a.status !== 'failed' && x.a.status !== 'expired'; }
  function working(x) { return x.a.status === 'tested' || x.a.status === 'official' || x.a.status === 'likely'; }

  function derive() {
    var now = new Date();
    var raw = S.raw || { deals: [] };
    var testsBy = {};
    (raw.tests || []).forEach(function (t) { (testsBy[t.deal_id] = testsBy[t.deal_id] || []).push(t); });
    S.items = []; S.byId = {}; S.byDomain = {};
    (raw.deals || []).forEach(function (rec) {
      if (!rec || !rec.d) return;
      var a = E.assess(rec, { now: now, sight: raw.sight || {}, tests: testsBy[rec.id] || [] });
      var x = { rec: rec, a: a };
      S.items.push(x); S.byId[rec.id] = x;
      (S.byDomain[rec.d.domain] = S.byDomain[rec.d.domain] || []).push(x);
    });
    computeStacks();
  }

  function realDomain(d) { return d && d.indexOf('deal:') !== 0 && d !== 'unknown'; }

  function computeStacks() {
    S.stacks = {}; S.extras = {};
    Object.keys(S.byDomain).forEach(function (dom) {
      if (!realDomain(dom)) return;
      var items = S.byDomain[dom];
      var st = E.storeFor(dom, items.map(function (x) { return x.rec; }));
      var plan = E.planForStore(st, items, S.settings, 100);
      S.stacks[dom] = plan;
      var discPct = plan.discount ? plan.discount.value : 0;
      S.extras[dom] = plan.best ? Math.max(0, plan.best.total - discPct) : 0;
    });
    S.recs = E.recommend(S.items, S.settings, S.extras);
  }

  /* ---------------- shared pieces ---------------- */
  function stubFor(x) {
    var p = x.a.terms, d = x.rec.d;
    var pre = p.upTo ? 'up to' : (p.extra ? 'extra' : '');
    var big = '', unit = '', sm = false;
    if (p.item && d.price && !p.pct && !p.amt) { big = E.money(d.price); unit = 'DEAL'; }
    else if ((d.kind === 'cardoffer' || d.kind === 'portal') && (p.cashPct || p.cashAmt)) {
      big = p.cashPct ? E.pctStr(p.cashPct) : E.money(p.cashAmt); unit = 'BACK';
    } else if (p.pct) { big = E.pctStr(p.pct); unit = 'OFF'; }
    else if (p.amt) { big = E.money(p.amt); unit = 'OFF'; }
    else if (p.cashPct) { big = E.pctStr(p.cashPct); unit = 'BACK'; }
    else if (p.cashAmt) { big = E.money(p.cashAmt); unit = 'BACK'; }
    else if (p.bogo) { big = 'BOGO'; sm = true; }
    else if (p.freeShip) { big = 'FREE'; unit = 'SHIP'; sm = true; }
    else if (d.price) { big = E.money(d.price); unit = 'DEAL'; sm = String(big).length > 5; }
    else { big = 'DEAL'; sm = true; }
    if (String(big).length >= 5) sm = true;
    return '<div class="stub" data-kind="' + esc(d.kind) + '">' + (pre ? '<span class="pre">' + esc(pre) + '</span>' : '') +
      '<span class="big' + (sm ? ' sm' : '') + '">' + esc(big) + '</span>' + (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div>';
  }

  function statusPill(a, withScore) {
    var s = E.STATUS[a.status] || { label: a.status };
    return '<span class="status s-' + esc(a.status) + '"><i></i>' + esc(s.label) + (withScore !== false ? ' <span class="sc">' + a.score + '</span>' : '') + '</span>';
  }

  function kindWord(d) {
    if (d.kind === 'cardoffer') return (E.PROGRAMS[d.card] || {}).name || 'Card offer';
    if (d.kind === 'portal') return 'Capital One Shopping';
    return null;
  }

  function couponCard(x, why) {
    var d = x.rec.d, a = x.a;
    var cat = E.CAT_BY_ID[d.cat];
    var kw = kindWord(d);
    var title = d.kind === 'cardoffer' || d.kind === 'portal' ? (kw + ': ' + (a.terms.headline || d.title)) : d.title;
    return '<button class="coupon" data-action="deal" data-id="' + esc(x.rec.id) + '">' + stubFor(x) +
      '<div class="cbody"><div class="row1"><span class="brand">' + esc(d.brand) + '</span>' + statusPill(a) + '</div>' +
      '<div class="ctitle">' + esc(title) + '</div>' +
      (a.terms.gist ? '<div class="gist">' + esc(a.terms.gist) + '</div>' : '') +
      '<div class="row3">' + (d.code ? '<span class="codetag">' + esc(d.code) + '</span>' : '') +
      (why && why.length ? '<span class="why">' + esc(why[0]) + '</span>' : (cat ? '<span class="cattag">' + esc(cat.label) + '</span>' : '')) +
      '</div></div></button>';
  }

  function emptyBox(title, body) { return '<div class="empty"><b>' + esc(title) + '</b>' + esc(body) + '</div>'; }

  function stackSummary(plan) {
    var b = plan.best;
    if (!b) return '';
    var bits = b.parts.map(function (p) {
      if (p.kind === 'discount') return p.label;
      if (p.kind === 'reward') return b.card.short;
      return p.label;
    });
    return bits.join(' + ');
  }

  function stackRow(dom, plan) {
    var b = plan.best;
    return '<button class="stackrow" data-action="way" data-domain="' + esc(dom) + '"><span class="nm">' + esc(plan.store.name) + '</span>' +
      '<span class="pc">' + E.pctStr(b.totalPct) + '<small>on $100</small></span>' +
      '<span class="how">Pay with ' + esc(b.card.short) + ' · ' + esc(stackSummary(plan)) + '</span></button>';
  }

  function topStacks(n, filterCat) {
    var rows = Object.keys(S.stacks).map(function (dom) { return [dom, S.stacks[dom]]; }).filter(function (r) {
      var p = r[1];
      if (!p.best || !p.best.total) return false;
      var hasDeal = (S.byDomain[r[0]] || []).some(usable);
      if (!hasDeal) return false;
      if (filterCat && filterCat !== 'all' && p.store.cat !== filterCat) return false;
      return true;
    });
    rows.sort(function (a, b) { return b[1].best.totalPct - a[1].best.totalPct; });
    return rows.slice(0, n);
  }

  /* ---------------- views ---------------- */
  function viewForYou() {
    var all = S.items.filter(usable);
    var tested = all.filter(function (x) { return x.a.status === 'tested'; });
    var cats = catCounts(all);
    var mine = S.settings.categories || [];
    var fc = S.fy.cat;
    var recs = S.recs.filter(function (x) { return fc === 'all' || x.rec.d.cat === fc; });
    var bestStack = topStacks(1)[0];
    var h = '<header class="view-head"><h1>For you</h1><p class="sub">' +
      (mine.length ? 'Ranked for ' + mine.map(function (c) { return E.CAT_BY_ID[c] ? E.CAT_BY_ID[c].label : c; }).join(', ') + ', your list and your cards.' : 'Ranked by value, how sure we are they work, your list and your cards.') + '</p></header>';
    h += '<div class="tally"><div><b>' + all.filter(working).length + '</b><span>deals that should work</span></div>' +
      '<div><b>' + tested.length + '</b><span>worked at a checkout</span></div>' +
      '<div><b>' + (bestStack ? E.pctStr(bestStack[1].best.totalPct) : '–') + '</b><span>' + (bestStack ? 'best stack, ' + esc(bestStack[1].store.name) : 'best stack') + '</span></div></div>';
    h += '<div class="chips" role="group" aria-label="Category">' + chip('fy-cat', 'all', 'All', fc === 'all') +
      orderCats(cats).map(function (c) { return chip('fy-cat', c.id, c.label, fc === c.id, cats[c.id]); }).join('') +
      (mine.length ? '' : '<button class="chip" data-action="settings" data-focus="cats">Pick your categories…</button>') + '</div>';

    h += '<section><div class="sec-head"><h2>Best matches</h2><span class="hint">value × reliability × your picks</span></div>';
    h += recs.length ? '<div class="list">' + recs.slice(0, 8).map(function (x) { return couponCard(x, x.why); }).join('') + '</div>' : emptyBox('Nothing here yet', ' Deals show up after the collector runs. Pull to refresh with the button at the top.');
    h += '</section>';

    var stacks = topStacks(5, fc);
    if (stacks.length) {
      h += '<section><div class="sec-head"><h2>Biggest stacks right now</h2><button class="more" data-action="tab" data-tab="way">Best Way</button></div>';
      h += stacks.map(function (r) { return stackRow(r[0], r[1]); }).join('') + '</section>';
    }
    var soon = all.filter(function (x) { return x.a.daysLeft != null && x.a.daysLeft <= 3 && working(x) && (fc === 'all' || x.rec.d.cat === fc) && E.typicalPct(x.a.terms, x.rec.d) > 0; })
      .sort(function (a, b) { return a.a.daysLeft - b.a.daysLeft || b.a.score - a.a.score; });

  }

  function browseList() {
    var b = S.browse;
    var q = b.q.trim().toLowerCase();
    var rankOf = {};
    S.recs.forEach(function (x, i) { rankOf[x.rec.id] = i; });
    var list = S.items.filter(function (x) {
      var st = x.a.status;
      if (b.status === 'working' && !working(x)) return false;
      if (b.status === 'tested' && st !== 'tested') return false;
      if (b.status === 'all' && (st === 'failed' || st === 'expired')) return false;
      if (b.status === 'failed' && st !== 'failed') return false;
      if (b.type !== 'all' && x.rec.d.kind !== b.type) return false;
      if (b.cats.length && b.cats.indexOf(x.rec.d.cat) < 0) return false;
      if (q) {
        var d = x.rec.d;
        var hay = (d.brand + ' ' + d.title + ' ' + (d.code || '') + ' ' + d.terms + ' ' + d.domain).toLowerCase();
        if (q.split(/\s+/).some(function (w) { return hay.indexOf(w) < 0; })) return false;
      }
      return true;
    });
    var sorters = {
      best: function (a, c) { var ra = rankOf[a.rec.id], rc = rankOf[c.rec.id]; if (ra == null && rc == null) return c.a.score - a.a.score; if (ra == null) return 1; if (rc == null) return -1; return ra - rc; },
      savings: function (a, c) { return E.typicalPct(c.a.terms, c.rec.d) - E.typicalPct(a.a.terms, a.rec.d); },
      ending: function (a, c) { var x = a.a.daysLeft == null ? 999 : a.a.daysLeft, y = c.a.daysLeft == null ? 999 : c.a.daysLeft; return x - y; },
      newest: function (a, c) { return String(c.rec.d.posted || c.rec.fs).localeCompare(String(a.rec.d.posted || a.rec.fs)); },
      reliable: function (a, c) { return c.a.score - a.a.score; }
    };
    list.sort(sorters[b.sort] || sorters.best);
    return list;
  }
  function browseResults() {

  /* Best way */
  function allStores() {
    var seen = {};

    Object.keys(S.byDomain).forEach(function (dom) {
      if (!realDomain(dom)) return;
      var st = E.storeFor(dom, S.byDomain[dom].map(function (x) { return x.rec; }));
      seen[dom] = 1;
      out.push({ domain: dom, name: st.name, n: S.byDomain[dom].filter(usable).length, pseudo: !!st.pseudo });
    });
    E.BRANDS.forEach(function (b) { if (!seen[b.domain]) { seen[b.domain] = 1; out.push({ domain: b.domain, name: b.name, n: 0, pseudo: b.pseudo }); } });
    return out;
  }
  function suggestions(q) {

      .sort(function (a, b) { var as = a.name.toLowerCase().indexOf(q) === 0 ? 0 : 1, bs = b.name.toLowerCase().indexOf(q) === 0 ? 0 : 1; return as - bs || b.n - a.n || a.name.localeCompare(b.name); })

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { }
      document.body.removeChild(ta);
      toast(ok ? 'Copied' : 'Press and hold to copy: ' + text);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback);
    else fallback();
  }

  function runOcr(file) {
    S.ocr = { state: 'reading' }; paintOcr();
    loadScript(OCR_URL).then(function () {
      if (!window.Tesseract) throw new Error('reader not available');
      return window.Tesseract.recognize(file, 'eng');
    }).then(function (res) {
      var found = E.parseOfferText(res && res.data ? res.data.text : '');
      S.ocr = { state: 'review', rows: found.map(function (f) { return { merchant: f.merchant, value: f.pct ? (f.upTo ? 'up to ' : '') + f.pct + '%' : '$' + f.amt, raw: f.raw, include: true }; }) };
      paintOcr();
    }).catch(function () {
      S.ocr = { state: 'error', msg: S.demo ? 'Reading screenshots works in your launched app, not in this preview.' : "Couldn't read that image. Check your connection and try a clearer screenshot." };
      paintOcr();
    });
  }
  function paintOcr() { var o = $('#ocrout'); if (o) o.innerHTML = ocrBlock(); }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      if (document.querySelector('script[src="' + src + '"]')) return resolve();
      var s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
    });
  }
  function saveOcr() {
    var prog = S.ocrProgram;
    var rows = (S.ocr && S.ocr.rows || []).filter(function (r) { return r.include && r.merchant; });
    if (!rows.length) return;
    var now = new Date();
    var recs = rows.map(function (r) {
      var g = E.guessDomainFromName(r.merchant) || { domain: 'deal:' + E.normName(r.merchant), brand: null };
      var val = String(r.value || '').trim();
      var title = /back|off/i.test(val) ? val : val + ' back';
      return E.makeRecord({
        domain: g.domain, brand: g.brand ? g.brand.name : r.merchant, kind: prog === 'c1shopping' ? 'portal' : 'cardoffer',
        card: prog === 'c1shopping' ? null : prog, portal: prog === 'c1shopping' ? 'c1shopping' : null,
        title: title, terms: r.raw || '', sourceType: 'card', sourceName: (E.PROGRAMS[prog] || {}).name, guessed: g.guessed
      }, now);
    });
    if (S.live) {
      api('/api/ingest', { method: 'POST', body: { source: 'screenshot:' + prog, deals: recs } }).then(function (j) {
        if (j.ok) { toast('Saved ' + j.accepted + ' offers'); S.ocr = null; load(); }
        else toast(j.error || 'Could not save.');
      });
    } else {
      var nowIso = now.toISOString();
      recs.forEach(function (r) {
        S.raw.deals = S.raw.deals.filter(function (x) { return x.id !== r.id; });
        S.raw.deals.push({ id: r.id, d: r.data, fs: nowIso, ls: nowIso });
      });
      S.ocr = null; derive(); repaintView(); toast('Saved ' + recs.length + ' offers');
    }
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');

      if (!ev.target.closest('.picker')) { var sg = $('#waysug'); if (sg) sg.hidden = true; }
      return;
    }
    var a = el.getAttribute('data-action');
    var val = el.getAttribute('data-val');
    switch (a) {
      case 'tab': closeSheet(); setTab(el.getAttribute('data-tab')); break;
      case 'deal': openSheet('deal', el.getAttribute('data-id')); break;
      case 'close': closeSheet(); break;
      case 'copy': copyText(val); break;
      case 'terms': S.sheet.full = !S.sheet.full; paintSheet(); break;
      case 'settings':
        openSheet('settings');
        if (el.getAttribute('data-focus')) setTimeout(function () { var c = $('#cats'); if (c) c.scrollIntoView(); }, 30);
        break;
      case 'refresh': if (S.live) load(true); break;
      case 'fy-cat': S.fy.cat = val; repaintView(); break;
      case 'br-cat':
        if (val === 'all') S.browse.cats = [];
        else { var i = S.browse.cats.indexOf(val); if (i >= 0) S.browse.cats.splice(i, 1); else S.browse.cats.push(val); }
        S.browse.limit = 40; repaintView(); break;
      case 'more': S.browse.limit += 40; $('#bresults').innerHTML = browseResults(); break;
      case 'way': goWay(el.getAttribute('data-domain')); break;
      case 'mark': markDeal(el.getAttribute('data-id'), el.getAttribute('data-ok') === '1'); break;
      case 'hide': hideDeal(el.getAttribute('data-id')); break;
      case 'pref-cat': {
        var cs = S.settings.categories; var k = cs.indexOf(val);
        if (k >= 0) cs.splice(k, 1); else cs.push(val);
        saveSettings(); paintSheet(); repaintView(); break;
      }
      case 'plan-cat': {
        var c = E.CAT_BY_ID[val];
        S.settings.plan.push({ text: c.label, type: 'category', cat: val });
        saveSettings(); repaintView(); toast('Added ' + c.label); break;
      }
      case 'list-open': { var n = +el.getAttribute('data-i'); S.listOpen[n] = !S.listOpen[n]; repaintView(); break; }
      case 'list-del': {
        var m = +el.getAttribute('data-i'); S.settings.plan.splice(m, 1); S.listOpen = {};
        saveSettings(); repaintView(); break;
      }
      case 'stash-tier': S.settings.stash.tier = +val; saveSettings(); repaintView(); break;
      case 'stash-brand': {
        var br = S.settings.stash.brands; var j = br.indexOf(val);

      case 'forget': store.del('key'); store.del('cache'); S.key = ''; S.raw = null; S.mode = 'connect'; S.connectErr = ''; closeSheet(); render(); break;
    }
